name: Private dashboard archive sync

on:
  workflow_run:
    workflows: ["Hesap Bazli Izlenme Raporu"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Successful daily statistics run ID to sync
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: private-dashboard-archive-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install locked dependencies
        run: pip install --require-hashes -r requirements.txt
      - name: Sync the latest seven days from the verified artifact
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id || inputs.source_run_id }}
          DASHBOARD_INGEST_URL: ${{ secrets.DASHBOARD_INGEST_URL }}
          DASHBOARD_INGEST_TOKEN: ${{ secrets.DASHBOARD_INGEST_TOKEN }}
          DASHBOARD_SYNC_DAYS: "7"
        run: python dashboard_archive_push.py
