name: Threads and YouTube publication notifications
on:
  schedule:
    - cron: '19,49 * * * *'
  workflow_run:
    workflows: ['Publish owned Instagram videos on Threads', 'ToonZone first season on Threads']
    types: [completed]
    branches: [main]
  pull_request:
    paths:
      - platform_publication_notifications.py
      - publisher_alert_history.py
      - test_platform_publication_notifications.py
      - .github/workflows/platform_publication_notifications.yml
  push:
    branches: [main]
    paths:
      - platform_publication_notifications.py
      - publisher_alert_history.py
      - test_platform_publication_notifications.py
      - .github/workflows/platform_publication_notifications.yml

permissions:
  contents: read
  actions: read
concurrency:
  group: platform-publication-notifications
  cancel-in-progress: false

jobs:
  tests:
    if: github.event_name != 'schedule' && github.event_name != 'workflow_run'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: pip install --require-hashes -r requirements.txt
      - run: python -m unittest -v test_platform_publication_notifications.py test_publisher_alert_history.py

  notify:
    needs: tests
    if: >-
      always() && github.ref == 'refs/heads/main' && github.run_attempt == 1 &&
      vars.PLATFORM_PUBLICATION_NOTIFICATIONS_ENABLED != 'false' &&
      (github.event_name == 'schedule' || (github.event_name == 'push' && needs.tests.result == 'success') ||
      (github.event_name == 'workflow_run' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.event != 'pull_request'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: |
          pip install --require-hashes -r requirements.txt
          pip install gdown==6.4.2
      - name: Read publication evidence and reserve notifications
        env:
          TOKEN_CHANNEL1_JSON: ${{ secrets.TOKEN_CHANNEL1_JSON }}
          TOKEN_CHANNEL2_JSON: ${{ secrets.TOKEN_CHANNEL2_JSON }}
          TOKEN_DAILY_LAUGH_LAB_JSON: ${{ secrets.TOKEN_DAILY_LAUGH_LAB_JSON }}
          TOKEN_GONLE_DUSEN_JSON: ${{ secrets.TOKEN_GONLE_DUSEN_JSON }}
          TARLADAKI_THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_TARLADAKI_FASULYE_ACCESS_TOKEN || secrets.TARLADAKI_THREADS_ACCESS_TOKEN }}
          PENGUEN_THREADS_ACCESS_TOKEN: ${{ secrets.PENGUEN_THREADS_ACCESS_TOKEN || secrets.THREADS_ACCESS_TOKEN }}
          GONLE_THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_GONLE_DUSEN_ACCESS_TOKEN || secrets.GONLE_THREADS_ACCESS_TOKEN }}
          DAILY_LAUGH_THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_DAILY_LAUGH_LAB_ACCESS_TOKEN || secrets.DAILY_LAUGH_THREADS_ACCESS_TOKEN }}
          FILM_THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_FILM_MAGARASI_ACCESS_TOKEN || secrets.FILM_THREADS_ACCESS_TOKEN }}
          TOONZONE_THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_TOONZONE_ACCESS_TOKEN || secrets.TOONZONE_THREADS_ACCESS_TOKEN }}
          TARLADAKI_THREADS_USERNAME: ${{ vars.TARLADAKI_THREADS_USERNAME || 'tarladakifasulye_' }}
          PENGUEN_THREADS_USERNAME: ${{ vars.PENGUEN_THREADS_USERNAME || 'beyinsiz.penguen' }}
          GONLE_THREADS_USERNAME: ${{ vars.GONLE_THREADS_USERNAME || 'gonl_edusen' }}
          DAILY_LAUGH_THREADS_USERNAME: ${{ vars.DAILY_LAUGH_THREADS_USERNAME || 'dail.ylaughlab' }}
          FILM_THREADS_USERNAME: ${{ vars.FILM_THREADS_USERNAME || 'film_magrasi' }}
          TOONZONE_THREADS_USERNAME: ${{ vars.TOONZONE_THREADS_USERNAME || 'toonzone.tr' }}
          TARLADAKI_THREADS_USER_ID: ${{ vars.TARLADAKI_THREADS_USER_ID }}
          PENGUEN_THREADS_USER_ID: ${{ vars.PENGUEN_THREADS_USER_ID }}
          GONLE_THREADS_USER_ID: ${{ vars.GONLE_THREADS_USER_ID }}
          DAILY_LAUGH_THREADS_USER_ID: ${{ vars.DAILY_LAUGH_THREADS_USER_ID }}
          FILM_THREADS_USER_ID: ${{ vars.FILM_THREADS_USER_ID }}
          TOONZONE_THREADS_USER_ID: ${{ vars.TOONZONE_THREADS_USER_ID }}
        run: python platform_publication_notifications.py prepare
      - name: Archive notification intent before Telegram delivery
        id: archive
        uses: actions/upload-artifact@v4
        with:
          name: platform-notification-intent
          path: platform-notification-runtime/alert-history.json
          if-no-files-found: error
          retention-days: 14
      - name: Send reserved Telegram notifications
        env:
          PLATFORM_NOTICE_INTENT_ARCHIVED: ${{ steps.archive.outcome == 'success' && 'true' || 'false' }}
        run: python platform_publication_notifications.py send
      - name: Archive Telegram acknowledgements
        if: always() && steps.archive.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: platform-notification-result
          path: platform-notification-runtime/alert-history.json
          if-no-files-found: error
          retention-days: 14
