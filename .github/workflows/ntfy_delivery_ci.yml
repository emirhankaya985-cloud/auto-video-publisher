name: NTFY delivery safety tests

on:
  pull_request:
    paths:
      - 'ntfy_notifications.py'
      - 'ntfy_report_failure_alert.py'
      - 'ntfy_daily_schedule_watch.py'
      - 'test_ntfy_daily_schedule_watch.py'
      - '.github/workflows/daily_report_watch.yml'
      - 'test_ntfy_report_failure_alert.py'
      - '.github/workflows/daily_stats.yml'
      - 'ntfy_phone_report.py'
      - 'test_ntfy_phone_report.py'
      - 'test_ntfy_notifications.py'
      - 'ntfy_smoke_test.py'
      - 'test_ntfy_smoke_test.py'
      - '.github/workflows/ntfy_server_smoke.yml'
      - 'stats_reporter.py'
      - 'test_stats_reporter.py'
      - '.github/workflows/ntfy_delivery_ci.yml'
      - 'requirements.txt'
  push:
    branches: [main]
    paths:
      - 'ntfy_notifications.py'
      - 'ntfy_report_failure_alert.py'
      - 'ntfy_daily_schedule_watch.py'
      - 'test_ntfy_daily_schedule_watch.py'
      - '.github/workflows/daily_report_watch.yml'
      - 'test_ntfy_report_failure_alert.py'
      - '.github/workflows/daily_stats.yml'
      - 'ntfy_phone_report.py'
      - 'test_ntfy_phone_report.py'
      - 'test_ntfy_notifications.py'
      - 'ntfy_smoke_test.py'
      - 'test_ntfy_smoke_test.py'
      - '.github/workflows/ntfy_server_smoke.yml'
      - 'stats_reporter.py'
      - 'test_stats_reporter.py'
      - '.github/workflows/ntfy_delivery_ci.yml'
      - 'requirements.txt'

permissions:
  contents: read

jobs:
  no-send-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: pip install --require-hashes -r requirements.txt
      - name: NTFY sender tests and reporter regression tests (mocked; no HTTP send)
        run: |
          python -m unittest -v test_ntfy_notifications.py test_ntfy_phone_report.py test_ntfy_smoke_test.py test_ntfy_report_failure_alert.py test_ntfy_daily_schedule_watch.py
          python - <<'PY'
          import inspect
          import test_stats_reporter
          names = [getattr(test_stats_reporter, n) for n in dir(test_stats_reporter)
                   if n.startswith('test_') and callable(getattr(test_stats_reporter, n))
                   and not inspect.signature(getattr(test_stats_reporter, n)).parameters]
          for fn in names:
              fn()
          print(f'Reporter assertions passed: {len(names)}')
          PY
