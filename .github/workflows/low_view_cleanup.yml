name: Low-view video cleanup assessment (read-only)

on:
  schedule:
    - cron: '17 0 */2 * *'
  workflow_dispatch:
  pull_request:
    paths:
      - 'low_view_cleanup.py'
      - 'test_low_view_cleanup.py'
      - '.github/workflows/low_view_cleanup.yml'

permissions:
  contents: read

concurrency:
  group: low-view-cleanup-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: pip install --require-hashes -r requirements.txt
      - run: python -m unittest -v test_low_view_cleanup.py

  assess:
    if: github.event_name != 'pull_request' && github.repository == 'emirhankaya985-cloud/auto-video-publisher' && github.ref == 'refs/heads/main' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: pip install --require-hashes -r requirements.txt
      - name: Collect account-bound view counts and assess candidates (read only)
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
        run: python -u low_view_cleanup.py
      - name: Preserve private read-only assessment (IDs retained for review)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: low-view-cleanup-assessment-${{ github.run_id }}
          path: low-view-cleanup-report.json
          if-no-files-found: warn
          retention-days: 90
