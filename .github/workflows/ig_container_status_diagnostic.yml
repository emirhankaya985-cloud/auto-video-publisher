name: Film ToonZone failed IG container status read-only
on:
  push:
    branches: [main]
    paths: ['docs/ig-container-status-recheck-2026-10-25.md']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check-containers:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: pip install --require-hashes -r requirements.txt
      - name: Verify no-send diagnostic behavior
        run: python -m unittest -v test_ig_container_status_diagnostic.py
      - name: Read only prior failed containers without uploads
        env:
          META_AUTH_JSON: ${{ secrets.META_AUTH_JSON }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
        run: python ig_container_status_diagnostic.py
      - name: Preserve redacted result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ig-failed-container-status-readonly
          path: ig-container-readonly-result.json
          retention-days: 30
          if-no-files-found: warn
