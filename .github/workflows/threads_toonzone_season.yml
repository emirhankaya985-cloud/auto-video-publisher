name: ToonZone first season on Threads
on:
  push:
    branches: [main]
    paths: ['docs/toonzone-season-threads-2026-11-05.md']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: threads-owner-publication
  cancel-in-progress: false
jobs:
  season:
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
      TOONZONE_THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_TOONZONE_ACCESS_TOKEN || secrets.TOONZONE_THREADS_ACCESS_TOKEN }}
      TOONZONE_THREADS_USERNAME: ${{ vars.TOONZONE_THREADS_USERNAME || 'toonzone.tr' }}
      TOONZONE_THREADS_USER_ID: ${{ vars.TOONZONE_THREADS_USER_ID }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: |
          pip install --require-hashes -r requirements.txt
          pip install gdown==6.4.2
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
      - run: python -m unittest test_threads_toonzone_season
      - name: Verify account and reserve the ordered 48-part catalog
        run: python threads_toonzone_season.py prepare
      - name: Persist reservations before publishing
        id: intent
        uses: actions/upload-artifact@v4
        with:
          name: toonzone-season-intent
          path: toonzone-season-runtime/alert-history.json
          if-no-files-found: error
          retention-days: 90
      - name: Publish and verify parts sequentially
        env:
          THREADS_INTENT_ARCHIVED: ${{ steps.intent.outcome == 'success' && 'true' || 'false' }}
        run: python threads_toonzone_season.py publish
      - name: Preserve verified IDs and unresolved reservations
        if: always() && steps.intent.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: toonzone-season-result
          path: toonzone-season-runtime/alert-history.json
          if-no-files-found: error
          retention-days: 90
