name: Read-only Meta credential preflight

on:
  pull_request:
    paths:
      - 'meta_access_preflight.py'
      - 'test_meta_access_preflight.py'
      - '.github/workflows/meta_access_preflight.yml'
  push:
    branches: [main]
    paths:
      - 'meta_access_preflight.py'
      - 'test_meta_access_preflight.py'
      - '.github/workflows/meta_access_preflight.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-redaction-and-no-post:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned runtime without credentials
        run: python -m pip install --require-hashes -r requirements.txt
      - name: Redacted authentication semantics only
        run: python -m unittest -v test_meta_access_preflight.py

  check-actual-main-credentials:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: test-redaction-and-no-post
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned runtime without publishing
        run: python -m pip install --require-hashes -r requirements.txt
      - name: Read-only classify Meta credential validity
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_AUTH_JSON: ${{ secrets.META_AUTH_JSON }}
        run: python meta_access_preflight.py
