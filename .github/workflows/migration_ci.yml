name: 985 Migration CI and setup status
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install locked runtime dependencies
        run: |
          python -m pip install --require-hashes -r requirements.txt
          python -m pip install PyYAML==6.0.2
      - name: Python regression tests without production credentials
        run: python migration_985_tests.py
      - name: Scheduler regression tests with mocked APIs
        run: node --test test/cloudflare_scheduler.test.mjs
  setup-status:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Report secret names only (no API calls)
        env:
          ANALYTICS_SHEETS_CREDENTIALS_JSON: ${{ secrets.ANALYTICS_SHEETS_CREDENTIALS_JSON }}
          BATCH_API_TOKEN: ${{ secrets.BATCH_API_TOKEN }}
          DAILY_LAUGH_DRIVE_FOLDER_ID: ${{ secrets.DAILY_LAUGH_DRIVE_FOLDER_ID }}
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
          DRIVE_TOKEN_JSON: ${{ secrets.DRIVE_TOKEN_JSON }}
          FILM_DRIVE_FOLDER_ID: ${{ secrets.FILM_DRIVE_FOLDER_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GONLE_DUSEN_DRIVE_FOLDER_ID: ${{ secrets.GONLE_DUSEN_DRIVE_FOLDER_ID }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_APP_ID: ${{ secrets.META_APP_ID }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          META_AUTH_JSON: ${{ secrets.META_AUTH_JSON }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TOPIC_URL: ${{ secrets.NTFY_TOPIC_URL }}
          PENGUEN_THREADS_VIDEO_URL_TEMPLATE: ${{ secrets.PENGUEN_THREADS_VIDEO_URL_TEMPLATE }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          TOKEN_CHANNEL1_JSON: ${{ secrets.TOKEN_CHANNEL1_JSON }}
          TOKEN_CHANNEL2_JSON: ${{ secrets.TOKEN_CHANNEL2_JSON }}
          TOKEN_DAILY_LAUGH_LAB_JSON: ${{ secrets.TOKEN_DAILY_LAUGH_LAB_JSON }}
          TOKEN_FILM_YOUTUBE_JSON: ${{ secrets.TOKEN_FILM_YOUTUBE_JSON }}
          TOKEN_GONLE_DUSEN_JSON: ${{ secrets.TOKEN_GONLE_DUSEN_JSON }}
        run: |
          python - <<'PYCODE'
          import os
          names = ['ANALYTICS_SHEETS_CREDENTIALS_JSON', 'BATCH_API_TOKEN', 'DAILY_LAUGH_DRIVE_FOLDER_ID', 'DRIVE_FOLDER_ID', 'DRIVE_TOKEN_JSON', 'FILM_DRIVE_FOLDER_ID', 'GITHUB_TOKEN', 'GONLE_DUSEN_DRIVE_FOLDER_ID', 'META_ACCESS_TOKEN', 'META_APP_ID', 'META_APP_SECRET', 'META_AUTH_JSON', 'NTFY_TOPIC', 'NTFY_TOPIC_URL', 'PENGUEN_THREADS_VIDEO_URL_TEMPLATE', 'THREADS_ACCESS_TOKEN', 'TOKEN_CHANNEL1_JSON', 'TOKEN_CHANNEL2_JSON', 'TOKEN_DAILY_LAUGH_LAB_JSON', 'TOKEN_FILM_YOUTUBE_JSON', 'TOKEN_GONLE_DUSEN_JSON']
          rows = ["## 985 connection setup", "| Setting | Status |", "| --- | --- |"]
          for name in names:
              rows.append(f"| {name} | {'Configured' if os.environ.get(name) else 'Missing'} |")
          rows.append("Production jobs require AUTOMATION_ENABLED=true. Configure credentials and route approvals before activation.")
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as output:
              output.write('\n'.join(rows) + '\n')
          print(f"Configured secret names: {sum(bool(os.environ.get(n)) for n in names)}/{len(names)}")
          PYCODE
