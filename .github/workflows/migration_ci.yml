name: 985 Migration CI and setup status
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'public_link_runtime.py'
      - 'content_hashtags.py'
      - 'test_content_hashtags.py'
      - 'instagram_media_compat.py'
      - 'test_instagram_media_compat.py'
      - 'publisher_recovery.py'
      - 'cloud_omnichannel_publisher.py'
      - 'meta_auth_loader.py'
      - 'publisher_error_journal.py'
      - 'publisher_incident_report.py'
      - 'test_publication_resilience.py'
      - 'test_film_duplicate_identity.py'
      - 'test_public_link_runtime.py'
      - 'test_publisher_recovery.py'
      - 'migration_985_tests.py'
      - '.github/workflows/migration_ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install locked runtime dependencies
        run: |
          python -m pip install --require-hashes -r requirements.txt
          python -m pip install PyYAML==6.0.2
      - name: Python regression tests without production credentials
        run: python migration_985_tests.py
      - name: Scheduler regression tests with mocked APIs
        run: node --test test/cloudflare_scheduler.test.mjs
  setup-status:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Report secret names only (no API calls)
        env:
          ANALYTICS_SHEETS_CREDENTIALS_JSON: ${{ secrets.ANALYTICS_SHEETS_CREDENTIALS_JSON }}
          BATCH_API_TOKEN: ${{ secrets.BATCH_API_TOKEN }}
          DAILY_LAUGH_DRIVE_FOLDER_ID: ${{ secrets.DAILY_LAUGH_DRIVE_FOLDER_ID }}
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
          DRIVE_TOKEN_JSON: ${{ secrets.DRIVE_TOKEN_JSON }}
          FILM_DRIVE_FOLDER_ID: ${{ secrets.FILM_DRIVE_FOLDER_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GONLE_DUSEN_DRIVE_FOLDER_ID: ${{ secrets.GONLE_DUSEN_DRIVE_FOLDER_ID }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          LINK_AUTOMATION_ENABLED: ${{ vars.LINK_AUTOMATION_ENABLED }}
          AUTOMATION_ENABLED: ${{ vars.AUTOMATION_ENABLED }}
          META_APP_ID: ${{ secrets.META_APP_ID }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          META_AUTH_JSON: ${{ secrets.META_AUTH_JSON }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TOPIC_URL: ${{ secrets.NTFY_TOPIC_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PENGUEN_THREADS_VIDEO_URL_TEMPLATE: ${{ secrets.PENGUEN_THREADS_VIDEO_URL_TEMPLATE }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          TOKEN_CHANNEL1_JSON: ${{ secrets.TOKEN_CHANNEL1_JSON }}
          TOKEN_CHANNEL2_JSON: ${{ secrets.TOKEN_CHANNEL2_JSON }}
          TOKEN_DAILY_LAUGH_LAB_JSON: ${{ secrets.TOKEN_DAILY_LAUGH_LAB_JSON }}
          TOKEN_FILM_YOUTUBE_JSON: ${{ secrets.TOKEN_FILM_YOUTUBE_JSON }}
          TOKEN_GONLE_DUSEN_JSON: ${{ secrets.TOKEN_GONLE_DUSEN_JSON }}
        run: |
          python - <<'PYCODE'
          import os
          names = ['ANALYTICS_SHEETS_CREDENTIALS_JSON', 'BATCH_API_TOKEN', 'DAILY_LAUGH_DRIVE_FOLDER_ID', 'DRIVE_FOLDER_ID', 'DRIVE_TOKEN_JSON', 'FILM_DRIVE_FOLDER_ID', 'GITHUB_TOKEN', 'GONLE_DUSEN_DRIVE_FOLDER_ID', 'META_ACCESS_TOKEN', 'META_APP_ID', 'META_APP_SECRET', 'META_AUTH_JSON', 'NTFY_TOPIC', 'NTFY_TOPIC_URL', 'TELEGRAM_BOT_TOKEN', 'TELEGRAM_CHAT_ID', 'PENGUEN_THREADS_VIDEO_URL_TEMPLATE', 'THREADS_ACCESS_TOKEN', 'TOKEN_CHANNEL1_JSON', 'TOKEN_CHANNEL2_JSON', 'TOKEN_DAILY_LAUGH_LAB_JSON', 'TOKEN_FILM_YOUTUBE_JSON', 'TOKEN_GONLE_DUSEN_JSON']
          rows = ["## 985 connection setup", "| Setting | Status |", "| --- | --- |"]
          for name in names:
              rows.append(f"| {name} | {'Configured' if os.environ.get(name) else 'Missing'} |")
          rows.append(f"Meta-only publisher enabled: {os.environ.get('LINK_AUTOMATION_ENABLED') == 'true'}")
          rows.append(f"Legacy OAuth publisher enabled: {os.environ.get('AUTOMATION_ENABLED') == 'true'}")
          rows.append("Meta-only publication uses LINK_AUTOMATION_ENABLED and META_ACCESS_TOKEN. Disabled legacy workflows may lack optional Drive/YouTube secrets.")
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as output:
              output.write('\n'.join(rows) + '\n')
          def status(enabled):
              return 'READY' if enabled else 'NOT READY'

          telegram_ready = bool(os.environ.get('TELEGRAM_BOT_TOKEN') and os.environ.get('TELEGRAM_CHAT_ID'))
          meta_ready = (os.environ.get('LINK_AUTOMATION_ENABLED') == 'true'
                        and bool(os.environ.get('META_ACCESS_TOKEN')))
          ntfy_ready = bool(os.environ.get('NTFY_TOPIC') or os.environ.get('NTFY_TOPIC_URL'))
          legacy_on = os.environ.get('AUTOMATION_ENABLED') == 'true'
          drive_ready = bool(os.environ.get('DRIVE_TOKEN_JSON'))
          rows = [
              "",
              "### Operational readiness — separate publishing paths",
              f"- Meta public-link publisher configured: **{status(meta_ready)}** (LINK_AUTOMATION_ENABLED + META_ACCESS_TOKEN).",
              f"- Telegram notification channel configured: **{status(telegram_ready)}**; actual delivery needs a separate smoke test.",
              f"- ntfy additional notification channel: **{status(ntfy_ready)}** (optional while Telegram is working).",
              f"- Legacy Drive/YouTube publisher: **{'ON' if legacy_on else 'OFF'}** (AUTOMATION_ENABLED).",
              f"- Legacy Drive credential present: **{'YES' if drive_ready else 'NO'}**.",
              "- Do not enable the legacy publisher until credentials, route permissions, previous AFK publisher state and Drive claims have been reconciled.",
              "- Green Actions jobs are not proof that a video was published; confirm individual platform post IDs.",
              "",
              f"[Add missing Secrets](https://github.com/emirhankaya985-cloud/auto-video-publisher/settings/secrets/actions) | [Review Variables](https://github.com/emirhankaya985-cloud/auto-video-publisher/settings/variables/actions) | [Publishing logs](https://github.com/emirhankaya985-cloud/auto-video-publisher/actions/workflows/public_link_schedule.yml)",
          ]
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as output:
              output.write('\\n'.join(rows) + '\\n')
          print(f"Configured secret names: {sum(bool(os.environ.get(n)) for n in names)}/{len(names)}")
          print(f"Readiness: telegram={status(telegram_ready)}; public_meta={status(meta_ready)}; ntfy_optional={status(ntfy_ready)}; legacy_enabled={legacy_on}; drive_present={drive_ready}")
          PYCODE
