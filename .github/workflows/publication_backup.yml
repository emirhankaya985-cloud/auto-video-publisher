name: Publication live acceptance and durable backup
on:
  push:
    branches: [main]
    paths:
      - 'docs/publication-backup-acceptance-2026-11-02.md'
      - '.github/workflows/publication_backup.yml'
  pull_request:
    paths:
      - 'durable_backup.py'
      - 'test_durable_backup.py'
      - 'test_publication_backup_workflow.py'
      - 'publication_live_acceptance.py'
      - '.github/workflows/publication_backup.yml'
  workflow_dispatch:
  schedule:
    # Once daily after the preceding 23:xx TRT statistics archive closes.
    # No hourly workflow_run fanout; absent credentials fail visibly, never green.
    - cron: '23 21 * * *'
permissions:
  contents: read
  actions: read
# Isolate offline PR checks from lengthy main live acceptance; keep main backups serialized.
concurrency:
  group: publication-durable-backup-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'main' }}
  cancel-in-progress: false
jobs:
  tests:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m unittest -v test_durable_backup.py test_publication_operations.py test_publication_backup_workflow.py
  backup:
    if: >-
      vars.DURABLE_DRIVE_BACKUP_ENABLED == 'true' &&
      github.event_name != 'pull_request' && github.ref == 'refs/heads/main' &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'push')
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install --require-hashes -r requirements.txt
      - name: Persist private content-addressed backup and verify actual download/restore
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DRIVE_TOKEN_JSON: ${{ secrets.DRIVE_TOKEN_JSON }}
        run: python durable_backup.py
      - name: Preserve redacted backup acceptance receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: durable-backup-receipt
          path: link-runtime/durable-backup-receipt.json
          if-no-files-found: error
          retention-days: 90
  acceptance:
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: |
          python -m pip install --require-hashes -r requirements.txt
          python -m pip install gdown==6.4.2
          command -v ffmpeg && command -v ffprobe || (sudo apt-get update -qq && sudo apt-get install -y ffmpeg)
      - name: Verify live stock, existing posts, one source quality and new engagement GETs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          ENABLE_TP_NORMAL_ROUTES: ${{ vars.ENABLE_TP_NORMAL_ROUTES }}
          ENABLE_DAILY_LAUGH_NORMAL_ROUTES: ${{ vars.ENABLE_DAILY_LAUGH_NORMAL_ROUTES }}
          ENABLE_GONLE_NORMAL_ROUTES: ${{ vars.ENABLE_GONLE_NORMAL_ROUTES }}
          ENABLE_GONLE_INSTAGRAM_ROUTES: ${{ vars.ENABLE_GONLE_INSTAGRAM_ROUTES }}
          ENABLE_FILM_ROUTES: ${{ vars.ENABLE_FILM_ROUTES }}
          FILM_RIGHTS_APPROVED: ${{ vars.FILM_RIGHTS_APPROVED }}
          ENABLE_TOONZONE_ROUTES: ${{ vars.ENABLE_TOONZONE_ROUTES }}
          ENABLE_NEW_META_ROUTES: ${{ vars.ENABLE_NEW_META_ROUTES }}
          META_NEW_ROUTES_RIGHTS_APPROVED: ${{ vars.META_NEW_ROUTES_RIGHTS_APPROVED }}
        run: python publication_live_acceptance.py
      - name: Preserve GET-only live evidence, never authoritative publisher state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: publication-live-acceptance
          path: |
            link-runtime/live-acceptance.json
            link-runtime/engagement-preview.json
            link-runtime/content-ranking.json
            link-runtime/content-stock.json
            link-runtime/report.md
          if-no-files-found: warn
          retention-days: 90
