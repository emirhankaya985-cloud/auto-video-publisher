name: 4 Kanalli Otonom Video Yayinci (2 YouTube + 1 FB + 1 IG)

permissions:
  contents: read

on:
  # GitHub Actions kendi zamanlayıcısıdır; harici cron servisine bağımlı değildir.
  # Türkiye UTC+3: 08:00-21:55 arasında her 5 dakika.
  schedule:
    - cron: '*/5 5-18 * * *'
    # Daily Laugh Lab's America/New_York slots: these extra UTC hours cover
    # both EST and EDT, including the new 20:00/22:00 NY slots. Python handles DST.
    - cron: '*/5 0,1,2,3,19,20,21,22,23 * * *'
  workflow_call:
    inputs:
      force_route:
        required: false
        type: string
        default: ''
      force_stem:
        required: false
        type: string
        default: ''
      backfill_route:
        required: false
        type: string
        default: ''
      backfill_audit_only:
        required: false
        type: boolean
        default: false
      routing_audit_only:
        required: false
        type: boolean
        default: false
      controlled_gonle_ig_test:
        description: 'Tek videoluk Gönle Instagram 400 doğrulama testi'
        required: false
        type: boolean
        default: false
      toonzone_ig_upload_only:
        description: 'Yalnızca önceki ToonZone Instagram hatalı dosyasını FINISHED durumuna kadar yükle; yayımlama ve kuyruk değişikliği yapma'
        required: false
        type: boolean
        default: false
      controlled_ig_recovery:
        description: 'Yalnızca onaylı Tarladaki/Penguen IG hata-sayacı kurtarması'
        required: false
        type: boolean
        default: false
      penguen_threads_connection_check:
        description: 'Yalnızca Threads tokenının Beyinsiz Penguen hesabına ait olduğunu salt-okunur doğrula'
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      force_route:
        description: 'Manuel test rotası'
        required: false
        type: choice
        options:
          - ''
          - gonle
          - gonle_fb
          - gonle_ig
          - daily_laugh
          - daily_laugh_youtube
          - gonle_youtube
          - film
          - toonzone
          - tarladaki
          - penguen
          - tarladaki_ig
          - penguen_ig
      force_stem:
        description: 'Yalnızca kurtarma için tam dosya adı (uzantısız)'
        required: false
        default: ''
      force_platform:
        description: 'Manuel çalışmada yalnızca tek platformu çalıştır'
        required: false
        type: choice
        options:
          - ''
          - instagram
          - facebook
          - youtube
          - threads
      film_ig_upload_only:
        description: 'Yalnızca sıradaki Film partını Instagram container işlemeye yükle; paylaşım/kuyruk kaydı yapma'
        required: false
        type: boolean
        default: false
      film_ig_diagnostic_clip_seconds:
        description: 'Upload-only kısa tanı klibi süresi (5-60); tam part için 0'
        required: false
        type: number
        default: 15
      film_ig_diagnostic_remux:
        description: 'Tam Film partını yeniden kodlamadan, yalnızca MP4 faststart ile paketleyip upload-only dene'
        required: false
        type: boolean
        default: false
      film_ig_test_list_only:
        description: 'Salt-okunur Film MP4 envanteri; upload veya yayın yapmaz'
        required: false
        type: boolean
        default: false
      film_ig_test_file_id:
        description: 'Tek bir doğrulanmış Film MP4 file ID; yalnızca upload-only testinde kullanılır'
        required: false
        type: string
        default: ''
      film_ig_test_file_ids:
        description: '15 benzersiz Film MP4 Drive ID; virgül veya satır sonuyla ayrılmış, yalnızca upload-only'
        required: false
        type: string
        default: ''
      film_ig_test_batch:
        description: 'Sabit 15 dosyalık upload-only test modunu açıkça seç'
        required: false
        type: boolean
        default: false
      film_ig_test_start_index:
        description: '15 dosyalık sabit listenin başlangıç indeksi: önce 0, sonra 2'
        required: false
        type: number
        default: 0
      film_ig_test_batch_count:
        description: 'İlk aşama 2 dosya; doğrulama sonrası kalan 13 dosya'
        required: false
        type: number
        default: 2
      film_ig_compact_test:
        description: 'Film upload-only compact H.264 Main deney profili'
        required: false
        type: boolean
        default: false
      film_claim_to_clear:
        description: 'Yalnızca yetkilendirilmiş stale Film claim; Part 4 kurtarması IG-only ve tek seferliktir'
        required: false
        type: string
        default: ''
      backfill_route:
        description: 'Bugünkü sayıyı 7’ye tamamla (boşsa normal çalışma)'
        required: false
        type: choice
        options:
          - ''
          - all
          - gonle_fb
          - gonle_ig
          - daily_laugh
          - tarladaki
          - penguen
      backfill_audit_only:
        description: 'Yalnızca bugünkü adetleri say, yayın yapma'
        required: false
        type: boolean
        default: false
      diagnostic_only:
        description: 'Yalnızca PR branchinde salt-okunur Instagram video tanılaması'
        required: false
        type: boolean
        default: false
      diagnostic_failed_file_id:
        description: 'Meta tarafında reddedilen MP4 Drive dosya IDsi'
        required: false
        type: string
      diagnostic_comparison_file_id:
        description: 'İsteğe bağlı başarılı MP4 Drive dosya IDsi'
        required: false
        type: string
      routing_audit_only:
        description: 'Yayın yapmadan Drive ve sosyal hesap yönlendirmelerini doğrula'
        required: false
        type: boolean
        default: false
      controlled_gonle_ig_test:
        description: 'Tek videoluk Gönle Instagram 400 doğrulama testi'
        required: false
        type: boolean
        default: false
      toonzone_ig_upload_only:
        description: 'Önceki ToonZone Instagram dosyasını yalnızca FINISHED olana kadar yükle; yayımlama ve kuyruk değişikliği yapma'
        required: false
        type: boolean
        default: false
      toonzone_part:
        description: 'Sırayla yayımlanacak ToonZone partı; önceki partlar tamamlanmış olmalı'
        required: false
        type: choice
        options:
          - ''
          - '1'
          - '2'
          - '3'
          - '4'
          - resume_part1_ig
      controlled_ig_recovery:
        description: 'Yalnızca onaylı Tarladaki/Penguen IG hata-sayacı kurtarması'
        required: false
        type: boolean
        default: false
      penguen_threads_connection_check:
        description: 'Yalnızca Threads tokenının Beyinsiz Penguen hesabına ait olduğunu salt-okunur doğrula'
        required: false
        type: boolean
        default: false

concurrency:
  group: cloud-omni-uploader
  cancel-in-progress: false
  # Default GitHub concurrency keeps only one pending run and replaces it
  # whenever another scheduled tick arrives. Keep a bounded queue of ticks.
  queue: max

jobs:
  instagram-video-diagnostic:
    if: >-
      vars.AUTOMATION_ENABLED == 'true' &&
      (github.event_name == 'workflow_dispatch' && inputs.diagnostic_only == true && github.ref == 'refs/heads/fix/stage-1-publisher-reliability')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Python 3.12 Kur
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: FFprobe Kur
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg
      - name: Bagimliliklari Yukle
        run: pip install --require-hashes -r requirements.txt
      - name: Gönle Instagram videosunu salt-okunur incele
        env:
          DRIVE_TOKEN_JSON: ${{ secrets.DRIVE_TOKEN_JSON }}
          GONLE_DUSEN_DRIVE_FOLDER_ID: ${{ secrets.GONLE_DUSEN_DRIVE_FOLDER_ID }}
          # Film klasör ID'si yayın allowlist'inde sabittir; secret/variable
          # boşluk veya yanlış değer yüzünden yanlış klasöre düşmeye izin verme.
          FILM_DRIVE_FOLDER_ID: 1NvEuGQ83BmCMrzdK6ziI1nC_0zzshqJW
          TOKEN_FILM_YOUTUBE_JSON: ${{ secrets.TOKEN_FILM_YOUTUBE_JSON }}
          DIAGNOSTIC_FAILED_FILE_ID: ${{ inputs.diagnostic_failed_file_id }}
          DIAGNOSTIC_COMPARISON_FILE_ID: ${{ inputs.diagnostic_comparison_file_id }}
        run: python instagram_drive_diagnostic.py

  omnichannel-upload:
    if: >-
      vars.AUTOMATION_ENABLED == 'true' &&
      (inputs.diagnostic_only != true && (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Kodlari Cek
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Python 3.12 Kur
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: FFmpeg uyumluluk yedeğini kur
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg

      - name: Bagimliliklari Yukle
        run: |
          pip install --require-hashes -r requirements.txt

      - name: Drive'dan Siradaki Videoyu 4 Kanala Birden Bas
        env:
          DRIVE_TOKEN_JSON: ${{ secrets.DRIVE_TOKEN_JSON }}
          TOKEN_CHANNEL1_JSON: ${{ secrets.TOKEN_CHANNEL1_JSON }}
          TOKEN_CHANNEL2_JSON: ${{ secrets.TOKEN_CHANNEL2_JSON }}
          TOKEN_DAILY_LAUGH_LAB_JSON: ${{ secrets.TOKEN_DAILY_LAUGH_LAB_JSON }}
          TOKEN_GONLE_DUSEN_JSON: ${{ secrets.TOKEN_GONLE_DUSEN_JSON }}
          ENABLE_NEW_YOUTUBE_ROUTES: ${{ vars.ENABLE_NEW_YOUTUBE_ROUTES }}
          ENABLE_NEW_META_ROUTES: ${{ vars.ENABLE_NEW_META_ROUTES }}
          META_NEW_ROUTES_RIGHTS_APPROVED: ${{ vars.META_NEW_ROUTES_RIGHTS_APPROVED }}
          ENABLE_DAILY_LAUGH_INSTAGRAM_ROUTES: ${{ vars.ENABLE_DAILY_LAUGH_INSTAGRAM_ROUTES }}
          ENABLE_EXISTING_ROUTES: ${{ vars.ENABLE_EXISTING_ROUTES }}
          ENABLE_TP_NORMAL_ROUTES: ${{ vars.ENABLE_TP_NORMAL_ROUTES }}
          TP_NORMAL_AUTOMATION_ONLY: ${{ vars.TP_NORMAL_AUTOMATION_ONLY }}
          ENABLE_DAILY_LAUGH_NORMAL_ROUTES: ${{ vars.ENABLE_DAILY_LAUGH_NORMAL_ROUTES }}
          ENABLE_GONLE_NORMAL_ROUTES: ${{ vars.ENABLE_GONLE_NORMAL_ROUTES }}
          ENABLE_GONLE_INSTAGRAM_ROUTES: ${{ vars.ENABLE_GONLE_INSTAGRAM_ROUTES }}
          ENABLE_FILM_ROUTES: ${{ vars.ENABLE_FILM_ROUTES }}
          FILM_RIGHTS_APPROVED: ${{ vars.FILM_RIGHTS_APPROVED }}
          ENABLE_TOONZONE_ROUTES: ${{ vars.ENABLE_TOONZONE_ROUTES }}
          TOONZONE_DRIVE_FOLDER_ID: 14ee4AnUdf03dYUAdtfpHa-E9Zxyh4UZF
          DG_NORMAL_AUTOMATION_ONLY: ${{ vars.DG_NORMAL_AUTOMATION_ONLY }}
          GONLE_IG_CONTROLLED_TEST: ${{ inputs.controlled_gonle_ig_test }}
          TOONZONE_IG_UPLOAD_ONLY: ${{ inputs.toonzone_ig_upload_only }}
          TOONZONE_PART: ${{ inputs.toonzone_part }}
          TOONZONE_RESUME_PART1_IG: 'false'
          CONTROLLED_IG_RECOVERY: ${{ inputs.controlled_ig_recovery }}
          META_AUTH_JSON: ${{ secrets.META_AUTH_JSON }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          NTFY_TOPIC_URL: ${{ secrets.NTFY_TOPIC_URL }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          PENGUEN_THREADS_VIDEO_URL_TEMPLATE: ${{ secrets.PENGUEN_THREADS_VIDEO_URL_TEMPLATE }}
          ENABLE_PENGUEN_THREADS: ${{ vars.ENABLE_PENGUEN_THREADS }}
          PENGUEN_THREADS_USERNAME: ${{ vars.PENGUEN_THREADS_USERNAME }}
          PENGUEN_THREADS_CONNECTION_CHECK: ${{ inputs.penguen_threads_connection_check }}
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
          GONLE_DUSEN_DRIVE_FOLDER_ID: ${{ secrets.GONLE_DUSEN_DRIVE_FOLDER_ID }}
          DAILY_LAUGH_DRIVE_FOLDER_ID: ${{ secrets.DAILY_LAUGH_DRIVE_FOLDER_ID }}
          FILM_DRIVE_FOLDER_ID: 1NvEuGQ83BmCMrzdK6ziI1nC_0zzshqJW
          FORCE_ROUTE: ${{ inputs.force_route }}
          FORCE_STEM: ${{ inputs.force_stem }}
          FILM_IG_UPLOAD_ONLY: ${{ inputs.film_ig_upload_only }}
          FILM_IG_DIAGNOSTIC_CLIP_SECONDS: ${{ inputs.film_ig_diagnostic_clip_seconds }}
          FILM_IG_DIAGNOSTIC_REMUX: ${{ inputs.film_ig_diagnostic_remux }}
          FILM_IG_TEST_LIST_ONLY: ${{ inputs.film_ig_test_list_only }}
          FILM_IG_TEST_FILE_ID: ${{ inputs.film_ig_test_file_id }}
          FILM_IG_TEST_FILE_IDS: ${{ inputs.film_ig_test_file_ids }}
          FILM_IG_TEST_BATCH: ${{ inputs.film_ig_test_batch }}
          FILM_IG_TEST_START_INDEX: ${{ inputs.film_ig_test_start_index }}
          FILM_IG_TEST_BATCH_COUNT: ${{ inputs.film_ig_test_batch_count }}
          FILM_IG_COMPACT_TEST: ${{ inputs.film_ig_compact_test }}
          FILM_CLAIM_TO_CLEAR: ${{ inputs.film_claim_to_clear }}
          BACKFILL_ROUTE: ${{ inputs.backfill_route }}
          BACKFILL_AUDIT_ONLY: ${{ inputs.backfill_audit_only }}
          FORCE_PLATFORM: ${{ inputs.force_platform }}
          MAX_DUE_SLOTS: ${{ vars.MAX_DUE_SLOTS || '2' }}
          MIN_PLATFORM_INTERVAL_SECONDS: ${{ vars.MIN_PLATFORM_INTERVAL_SECONDS || '60' }}
          ROUTING_AUDIT_ONLY: ${{ inputs.routing_audit_only }}
          COVER_FEATURE_ENABLED: ${{ vars.COVER_FEATURE_ENABLED }}
          COVER_DRIVE_FOLDER_ID: ${{ vars.COVER_DRIVE_FOLDER_ID }}
          COVER_TARLADAKI_FOLDER_ID: ${{ vars.COVER_TARLADAKI_FOLDER_ID }}
          COVER_PENGUEN_FOLDER_ID: ${{ vars.COVER_PENGUEN_FOLDER_ID }}
        run: |
          if [ "$TOONZONE_PART" = "resume_part1_ig" ]; then
            export TOONZONE_PART=1
            export TOONZONE_RESUME_PART1_IG=true
          fi
          if [ -n "$TOONZONE_PART" ] && [ "$FORCE_ROUTE" != "toonzone" ]; then
            echo "toonzone_part yalnızca force_route=toonzone ile kullanılabilir."
            exit 1
          fi
          if [ "$FORCE_ROUTE" = "toonzone" ] && [ -n "$TOONZONE_PART" ]; then
            case "$TOONZONE_PART" in
              1|2|3|4) export FORCE_SLOT_SUFFIX="toonzone-part$TOONZONE_PART" ;;
              *) echo "ToonZone part seçimi geçersiz."; exit 1 ;;
            esac
          fi
          if [ "$TOONZONE_RESUME_PART1_IG" = "true" ] && { [ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ] || [ "$FORCE_ROUTE" != "toonzone" ] || [ "$TOONZONE_PART" != "1" ] || [ "$FORCE_PLATFORM" != "instagram" ] || [ "$TOONZONE_IG_UPLOAD_ONLY" = "true" ] || [ -n "$BACKFILL_ROUTE" ] || [ -n "$FILM_CLAIM_TO_CLEAR" ]; }; then
            echo "Eski ToonZone Part 1 claim kurtarması yalnızca manuel Part 1 Instagram yayını için kullanılabilir."
            exit 1
          fi
          if [ "$PENGUEN_THREADS_CONNECTION_CHECK" = "true" ]; then
            if [ -n "$FORCE_ROUTE" ] || [ -n "$BACKFILL_ROUTE" ] || [ "$FILM_IG_UPLOAD_ONLY" = "true" ] || [ "$GONLE_IG_CONTROLLED_TEST" = "true" ] || [ "$TOONZONE_IG_UPLOAD_ONLY" = "true" ]; then
              echo "Threads bağlantı denetimi diğer rota ve test girdileriyle birlikte çalıştırılamaz."
              exit 1
            fi
            python check_threads_connection.py
            exit 0
          fi
          if [ "$GONLE_IG_CONTROLLED_TEST" = "true" ] && { [ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ] || [ "$FORCE_ROUTE" != "gonle_ig" ] || [ "$FORCE_PLATFORM" != "instagram" ] || [ "$FILM_IG_UPLOAD_ONLY" = "true" ] || [ -n "$FILM_CLAIM_TO_CLEAR" ] || [ -n "$BACKFILL_ROUTE" ]; }; then
            echo "Gönle kontrollü upload-only testi yalnızca manuel Gönle Instagram rotasında ve claimsiz/backfill'siz çalışabilir."
            exit 1
          fi
          if [ "$TOONZONE_IG_UPLOAD_ONLY" = "true" ] && { [ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ] || [ "$FORCE_ROUTE" != "toonzone" ] || [ "$FORCE_PLATFORM" != "instagram" ] || [ "$FILM_IG_UPLOAD_ONLY" = "true" ] || [ "$GONLE_IG_CONTROLLED_TEST" = "true" ] || [ -n "$FILM_CLAIM_TO_CLEAR" ] || [ -n "$BACKFILL_ROUTE" ]; }; then
            echo "ToonZone kontrollü upload-only testi yalnızca manuel ToonZone Instagram rotasında ve yan etkisiz çalışabilir."
            exit 1
          fi
          if [ "$FILM_IG_UPLOAD_ONLY" = "true" ] && { [ "$FORCE_ROUTE" != "film" ] || [ "$FORCE_PLATFORM" != "instagram" ]; }; then
            echo "Upload-only modu yalnızca force_route=film ve force_platform=instagram ile kullanılabilir."
            exit 1
          fi
          if [ "$FILM_IG_UPLOAD_ONLY" = "true" ] && { [ -n "$FILM_CLAIM_TO_CLEAR" ] || [ -n "$BACKFILL_ROUTE" ]; }; then
            echo "Upload-only modunda claim temizleme ve backfill yasak."
            exit 1
          fi
          if [ -n "$FILM_IG_TEST_FILE_IDS" ] && [ "$FILM_IG_UPLOAD_ONLY" != "true" ]; then
            echo "Çoklu Film dosya listesi yalnızca upload-only modunda kullanılabilir."
            exit 1
          fi
          if [ "$FILM_IG_TEST_BATCH" = "true" ] && { [ "$FILM_IG_UPLOAD_ONLY" != "true" ] || [ "$FORCE_ROUTE" != "film" ] || [ "$FORCE_PLATFORM" != "instagram" ]; }; then
            echo "Batch test yalnızca Film Instagram upload-only modunda kullanılabilir."
            exit 1
          fi
          if [ -n "$BACKFILL_ROUTE" ]; then
            python daily_backfill.py
          else
            python scheduled_multi_publisher.py
          fi
