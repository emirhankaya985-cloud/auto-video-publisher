name: Hesap Bazli Izlenme Raporu

permissions:
  contents: read
  actions: read

on:
  # GitHub cron UTC kullanır: 20:15 UTC = 23:15 TRT.
  # Erken gun sonu olcumu, cron gecikmesinin gece yarisina sarkma riskini azaltir.
  schedule:
    - cron: '15 20 * * *'
  workflow_dispatch:
  # One-time live verification only when the unique audit marker lands on main.
  push:
    branches: [main]
    paths: ['docs/meta-readonly-verification-2026-10-25.md']

concurrency:
  group: daily-stats-report
  cancel-in-progress: false

jobs:
  report:
    # Default enabled after explicit owner approval; variable=false is a kill switch.
    if: vars.META_REPORTING_ENABLED != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Kodlari Cek
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Python Kur
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Bagimliliklari Yukle
        run: pip install --require-hashes -r requirements.txt
      - name: Istatistikleri Telefona Gonder
        env:
          META_AUTH_JSON: ${{ secrets.META_AUTH_JSON }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          META_ONLY_REPORTING: 'true'
          NTFY_TOPIC_URL: ${{ secrets.NTFY_TOPIC_URL }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python stats_reporter.py
      - name: Preserve Meta view history for the next report (no Drive OAuth)
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: meta-daily-analytics-history
          path: link-runtime/daily_video_views.jsonl
          if-no-files-found: warn
          retention-days: 90
      - name: Failure notice (does not replace the failed daily report)
        if: ${{ failure() }}
        continue-on-error: true
        env:
          NTFY_TOPIC_URL: ${{ secrets.NTFY_TOPIC_URL }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python ntfy_report_failure_alert.py
