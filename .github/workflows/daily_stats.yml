name: Hesap Bazli Izlenme Raporu

permissions:
  contents: read
  actions: read

on:
  # GitHub cron UTC kullanır: 20:59 UTC = 23:59 TRT.
  # GitHub zamanlanmış işleri geciktirebilir; 23:59 kesin teslim saati değildir.
  # Drive yedeği 21:23 UTC olduğundan önce rapor ölçümünü hedefler.
  schedule:
    - cron: '59 20 * * *'
  workflow_dispatch:
  # One-time live verification only when the unique audit marker lands on main.
  push:
    branches: [main]
    paths: ['docs/meta-readonly-verification-2026-10-25.md']

concurrency:
  group: daily-stats-report
  cancel-in-progress: false

jobs:
  report:
    # Default enabled after explicit owner approval; variable=false is a kill switch.
    if: vars.META_REPORTING_ENABLED != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Kodlari Cek
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Python Kur
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Bagimliliklari Yukle
        run: pip install --require-hashes -r requirements.txt
      - name: Istatistikleri Telefona Gonder
        env:

          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          META_ONLY_REPORTING: 'true'
          MULTIPLATFORM_STATS_ENABLED: 'true'
          TOKEN_CHANNEL1_JSON: ${{ secrets.TOKEN_CHANNEL1_JSON }}
          TOKEN_CHANNEL2_JSON: ${{ secrets.TOKEN_CHANNEL2_JSON }}
          TOKEN_DAILY_LAUGH_LAB_JSON: ${{ secrets.TOKEN_DAILY_LAUGH_LAB_JSON }}
          TOKEN_GONLE_DUSEN_JSON: ${{ secrets.TOKEN_GONLE_DUSEN_JSON }}
          TARLADAKI_THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_TARLADAKI_FASULYE_ACCESS_TOKEN || secrets.TARLADAKI_THREADS_ACCESS_TOKEN }}
          PENGUEN_THREADS_ACCESS_TOKEN: ${{ secrets.PENGUEN_THREADS_ACCESS_TOKEN || secrets.THREADS_ACCESS_TOKEN }}
          GONLE_THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_GONLE_DUSEN_ACCESS_TOKEN || secrets.GONLE_THREADS_ACCESS_TOKEN }}
          DAILY_LAUGH_THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_DAILY_LAUGH_LAB_ACCESS_TOKEN || secrets.DAILY_LAUGH_THREADS_ACCESS_TOKEN }}
          FILM_THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_FILM_MAGARASI_ACCESS_TOKEN || secrets.FILM_THREADS_ACCESS_TOKEN }}
          TOONZONE_THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_TOONZONE_ACCESS_TOKEN || secrets.TOONZONE_THREADS_ACCESS_TOKEN }}
          TARLADAKI_THREADS_USERNAME: ${{ vars.TARLADAKI_THREADS_USERNAME || 'tarladakifasulye_' }}
          PENGUEN_THREADS_USERNAME: ${{ vars.PENGUEN_THREADS_USERNAME || 'beyinsiz.penguen' }}
          GONLE_THREADS_USERNAME: ${{ vars.GONLE_THREADS_USERNAME || 'gonl_edusen' }}
          DAILY_LAUGH_THREADS_USERNAME: ${{ vars.DAILY_LAUGH_THREADS_USERNAME || 'dail.ylaughlab' }}
          FILM_THREADS_USERNAME: ${{ vars.FILM_THREADS_USERNAME || 'film_magrasi' }}
          TOONZONE_THREADS_USERNAME: ${{ vars.TOONZONE_THREADS_USERNAME || 'toonzone.tr' }}
          TARLADAKI_THREADS_USER_ID: ${{ vars.TARLADAKI_THREADS_USER_ID }}
          PENGUEN_THREADS_USER_ID: ${{ vars.PENGUEN_THREADS_USER_ID }}
          GONLE_THREADS_USER_ID: ${{ vars.GONLE_THREADS_USER_ID }}
          DAILY_LAUGH_THREADS_USER_ID: ${{ vars.DAILY_LAUGH_THREADS_USER_ID }}
          FILM_THREADS_USER_ID: ${{ vars.FILM_THREADS_USER_ID }}
          TOONZONE_THREADS_USER_ID: ${{ vars.TOONZONE_THREADS_USER_ID }}
          ENGAGEMENT_HISTORY_ENABLED: ${{ vars.ENGAGEMENT_HISTORY_ENABLED != 'false' && 'true' || 'false' }}
          NTFY_TOPIC_URL: ${{ secrets.NTFY_TOPIC_URL }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_STATUS_INBOX_ENABLED: ${{ vars.TELEGRAM_STATUS_INBOX_ENABLED != 'false' && 'true' || 'false' }}
          NVIDIA_AI_ENABLED: ${{ vars.NVIDIA_AI_ENABLED }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          NVIDIA_MODEL: ${{ vars.NVIDIA_MODEL || 'nvidia/nemotron-3.5-super-vl-120b-a12b' }}
        run: python stats_reporter.py
      - name: Recommend posting hours from verified historical IDs (no schedule changes)
        if: success()
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python adaptive_publish_times.py
      - name: Preserve read-only hour recommendations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: publish-time-recommendations
          path: link-runtime/time-recommendations.json
          if-no-files-found: ignore
          retention-days: 90
      - name: Preserve engagement collection coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engagement-collection
          path: link-runtime/engagement-collection.json
          if-no-files-found: ignore
          retention-days: 90
      - name: Preserve Meta view history for the next report (no Drive OAuth)
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: meta-daily-analytics-history
          path: link-runtime/daily_video_views.jsonl
          if-no-files-found: warn
          retention-days: 90
      - name: Preserve account comparison evidence (no credentials)
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: account-views-comparison
          path: link-runtime/account_views_comparison.json
          if-no-files-found: warn
          retention-days: 90
      - name: Preserve publication count evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: publication-progress
          path: link-runtime/publication_progress.json
          if-no-files-found: warn
          retention-days: 90
      - name: Failure notice (does not replace the failed daily report)
        if: ${{ failure() }}
        continue-on-error: true
        env:
          NTFY_TOPIC_URL: ${{ secrets.NTFY_TOPIC_URL }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python ntfy_report_failure_alert.py
