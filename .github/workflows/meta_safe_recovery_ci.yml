name: Meta Page credential fallback no-publish CI

on:
  pull_request:
    paths:
      - '.github/workflows/public_link_schedule.yml'
      - '.github/workflows/tracked_meta_routes.yml'
      - '.github/workflows/meta_safe_recovery_ci.yml'
      - 'tracked_meta_routes.py'
      - 'test_tracked_meta_routes.py'
      - 'meta_auth_loader.py'
      - 'test_meta_auth_loader.py'
      - 'meta_page_token_health.py'
      - 'test_meta_page_token_health.py'
      - 'public_link_runtime.py'
      - 'test_public_link_runtime.py'
      - 'meta_schedule_preflight.py'
      - 'test_meta_schedule_preflight.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  read-only-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install --require-hashes -r requirements.txt
      - name: Check Page identity and unknown alert semantics (no Meta API calls)
        run: python -m unittest -v test_meta_auth_loader.py test_meta_page_token_health.py test_tracked_meta_routes.py test_public_link_runtime.py test_meta_schedule_preflight.py
