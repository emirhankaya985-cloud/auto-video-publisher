name: Gönle Düşen original Meta receipt GET-only

on:
  pull_request:
    paths:
      - meta_receipt_readonly.py
      - test_meta_receipt_readonly.py
      - .github/workflows/meta_receipt_readonly.yml
  push:
    branches: [main]
    paths:
      - meta_receipt_readonly.py
      - .github/workflows/meta_receipt_readonly.yml
  # Preserve the provider's eventual visibility without retrying a POST.
  # Four read-only probes/day; future no-POST results remain inspectable.
  schedule:
    - cron: '47 0,6,12,18 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: gonle-original-receipt-readonly
  cancel-in-progress: false

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m unittest -v test_meta_receipt_readonly.py

  readonly:
    needs: tests
    if: >-
      github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/main' &&
      github.repository == 'emirhankaya985-cloud/auto-video-publisher'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
      PUBLISH_ACCOUNT_SCOPE: gonle
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: pip install --require-hashes -r requirements.txt
      - name: Check exact archived provider ID, owner and captions — GET only
        run: python meta_receipt_readonly.py
      - name: Preserve confirmed or held status without resetting any ledger
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gonle-original-post-receipt-readonly
          path: meta-receipt-readonly/report.json
          if-no-files-found: warn
          retention-days: 30
