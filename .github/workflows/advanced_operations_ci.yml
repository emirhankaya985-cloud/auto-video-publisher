name: Advanced operations safety (no publish)
on:
  pull_request:
    paths:
      - 'media_similarity.py'
      - 'adaptive_publish_times.py'
      - 'offline_subtitles.py'
      - 'api_capacity_guard.py'
      - 'telegram_owner_control.py'
      - 'telegram_ai_worker.py'
      - 'meta_page_token_health.py'
      - 'public_link_runtime.py'
      - 'test_advanced_operations.py'
      - '.github/workflows/advanced_operations_ci.yml'
permissions:
  contents: read
jobs:
  safety:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install --require-hashes -r requirements.txt
      - name: Validate new code with no cloud secrets, posting or notifications
        env:
          ADVANCED_DEDUPE_ENABLED: 'false'
          TELEGRAM_CONTROL_ENABLED: 'false'
        run: |
          python -m unittest -v test_advanced_operations.py test_public_link_runtime.py test_meta_page_token_health.py test_publisher_recovery.py test_telegram_notifications.py
