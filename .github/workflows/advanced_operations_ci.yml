name: Advanced operations safety (no publish)
on:
  pull_request:
    paths:
      - 'media_similarity.py'
      - 'adaptive_publish_times.py'
      - 'offline_subtitles.py'
      - 'subtitle_pipeline.py'
      - 'install_subtitle_model.py'
      - 'adaptive_schedule.py'
      - 'test_subtitle_pipeline.py'
      - 'test_adaptive_schedule.py'
      - 'telegram_readonly_diagnostic.py'
      - 'test_telegram_readonly_diagnostic.py'
      - 'content_stock.py'
      - 'test_content_features.py'
      - '.github/workflows/public_link_schedule.yml'
      - 'api_capacity_guard.py'
      - 'telegram_owner_control.py'
      - 'telegram_ai_worker.py'
      - 'telegram_status.py'
      - 'test_telegram_status.py'
      - 'telegram_status_inbox.py'
      - 'test_telegram_status_inbox.py'
      - 'meta_page_token_health.py'
      - 'public_link_runtime.py'
      - 'test_advanced_operations.py'
      - '.github/workflows/advanced_operations_ci.yml'
permissions:
  contents: read
jobs:
  safety:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install --require-hashes -r requirements.txt
      - name: Install FFmpeg for real local video acceptance
        run: command -v ffmpeg && command -v ffprobe || (sudo apt-get update -qq && sudo apt-get install -y ffmpeg)
      - name: Validate new code with no cloud secrets, posting or notifications
        env:
          ADVANCED_DEDUPE_ENABLED: 'false'
          TELEGRAM_CONTROL_ENABLED: 'false'
          AUTO_SUBTITLES_ENABLED: 'false'
          ADAPTIVE_SCHEDULE_ENABLED: 'false'
        run: |
          python -m unittest -v test_advanced_operations.py test_public_link_runtime.py test_meta_page_token_health.py test_publisher_recovery.py test_telegram_notifications.py test_subtitle_pipeline.py test_adaptive_schedule.py test_telegram_readonly_diagnostic.py test_content_features.py test_telegram_status.py test_nvidia_assistant.py test_telegram_status_inbox.py
