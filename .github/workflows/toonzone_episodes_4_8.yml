name: ToonZone episodes 4-8 - ordered real covers and verified posts
on:
  pull_request:
    paths:
      - 'toonzone_episodes_4_8.py'
      - 'test_toonzone_episodes_4_8.py'
      - '.github/workflows/toonzone_episodes_4_8.yml'
  push:
    branches: [main]
    paths:
      - 'toonzone_episodes_4_8.py'
      - '.github/workflows/toonzone_episodes_4_8.yml'
      - 'docs/toonzone-episodes-4-8-release-2026-11-06.md'
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        required: true
        options: [audit, publish]
        default: audit
permissions:
  contents: read
  actions: read
concurrency:
  group: toonzone-owner-episodes-4-8
  cancel-in-progress: false
jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: |
          pip install --require-hashes -r requirements.txt
          pip install gdown==6.4.2 pillow==13.0.0 PyYAML==6.0.2
      - run: python -m unittest -v test_toonzone_episodes_4_8.py test_toonzone_first_three.py test_toonzone_translations.py
  live-audit:
    needs: tests
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    outputs:
      release_ready: ${{ steps.eligibility.outputs.release_ready }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
      GITHUB_RUN_ID: ${{ github.run_id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: |
          pip install --require-hashes -r requirements.txt
          pip install gdown==6.4.2 pillow==13.0.0
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            echo 'https://archive.ubuntu.com/ubuntu' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
            echo 'https://security.ubuntu.com/ubuntu' | sudo tee /etc/apt/apt-mirrors-security.txt >/dev/null
            sudo apt-get -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 -o Acquire::Retries=1 update -qq
            sudo apt-get -o Acquire::http::Timeout=20 -o Acquire::Retries=1 install -y --no-install-recommends ffmpeg
          fi
      - name: Check verified live media history and twenty exact Drive covers - NO POSTS
        run: python toonzone_episodes_4_8.py audit
      - name: Gate publication from exact safety audit evidence - NO POSTS
        id: eligibility
        if: success()
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          verdict = json.loads(Path("toonzone-4-8-runtime/audit.json").read_text())
          ready = (
              verdict.get("safe_to_reserve") is True
              and verdict.get("live_history_read") is True
              and verdict.get("instagram_identity_verified") is True
              and verdict.get("expected_parts") == 20
              and verdict.get("previously_verified", 0) + verdict.get("prepared_parts", 0) == 20
              and verdict.get("posts_created") == 0
          )
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write("release_ready=" + ("true" if ready else "false") + "\n")
          print(json.dumps({"read_only_audit": "verified_for_reserve" if ready else "held_no_publish",
                            "release_ready": ready, "meta_writes": 0}))
          PY
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: toonzone-4-8-readonly-audit
          path: toonzone-4-8-runtime/audit.json
          if-no-files-found: warn
          retention-days: 30
  publish:
    needs: [tests, live-audit]
    # Share the normal publisher lock across reserve, persisted intent and POSTs.
    concurrency:
      group: public-drive-recovery-toonzone
      cancel-in-progress: false
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch' &&
      inputs.mode == 'publish' &&
      needs.live-audit.outputs.release_ready == 'true' &&
      vars.TOONZONE_RIGHTS_APPROVED == 'true' &&
      vars.TOONZONE_RELEASE_4_8 == 'true' &&
      github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      GH_TOKEN: ${{ github.token }}
      META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      GITHUB_RUN_ID: ${{ github.run_id }}
      TOONZONE_RIGHTS_APPROVED: ${{ vars.TOONZONE_RIGHTS_APPROVED }}
      TOONZONE_RELEASE_4_8: ${{ vars.TOONZONE_RELEASE_4_8 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: |
          pip install --require-hashes -r requirements.txt
          pip install gdown==6.4.2 pillow==13.0.0
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            echo 'https://archive.ubuntu.com/ubuntu' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
            echo 'https://security.ubuntu.com/ubuntu' | sudo tee /etc/apt/apt-mirrors-security.txt >/dev/null
            sudo apt-get -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 -o Acquire::Retries=1 update -qq
            sudo apt-get -o Acquire::http::Timeout=20 -o Acquire::Retries=1 install -y --no-install-recommends ffmpeg
          fi
      - name: Reserve 20 exact sources before any Meta POST
        run: python toonzone_episodes_4_8.py reserve
      - name: Persist all intents
        id: reserve
        uses: actions/upload-artifact@v4
        with:
          name: toonzone-4-8-intent
          path: toonzone-4-8-runtime/alert-history.json
          if-no-files-found: error
          retention-days: 90
      - name: Release sequentially - stop on first uncertain POST
        env:
          TOONZONE_INTENT_ARCHIVED: ${{ steps.reserve.outcome == 'success' && 'true' || 'false' }}
        run: python toonzone_episodes_4_8.py publish
      - if: always() && steps.reserve.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: toonzone-4-8-result
          path: toonzone-4-8-runtime/alert-history.json
          if-no-files-found: error
          retention-days: 90
      - if: always() && steps.reserve.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: toonzone-4-8-summary
          path: toonzone-4-8-runtime/result.json
          if-no-files-found: ignore
          retention-days: 90
