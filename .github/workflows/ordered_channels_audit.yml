name: Film ve Cizgi Film Salt Okunur Denetim

permissions:
  contents: read

on:
  workflow_dispatch:

jobs:
  audit:
    if: vars.AUTOMATION_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Kodlari Cek
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Python 3.12 Kur
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Bagimliliklari Yukle
        run: pip install --require-hashes -r requirements.txt
      - name: Film ve cizgi film klasorlerini denetle
        env:
          DRIVE_TOKEN_JSON: ${{ secrets.DRIVE_TOKEN_JSON }}
        run: python ordered_channels.py --audit
