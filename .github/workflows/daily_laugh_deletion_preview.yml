name: Daily Laugh Lab post inventory (read-only)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['docs/daily-laugh-deletion-preview-2026-11-04.md']
  pull_request:
    paths:
      - 'daily_laugh_deletion_preview.py'
      - 'test_daily_laugh_deletion_preview.py'
      - '.github/workflows/daily_laugh_deletion_preview.yml'

permissions:
  contents: read

concurrency:
  group: daily-laugh-deletion-preview
  cancel-in-progress: false

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: pip install --require-hashes -r requirements.txt
      - run: python -m unittest -v test_daily_laugh_deletion_preview.py

  preview:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && github.repository == 'emirhankaya985-cloud/auto-video-publisher'
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: pip install --require-hashes -r requirements.txt
      - name: Enumerate only the configured Daily Laugh Lab accounts
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          TOKEN_DAILY_LAUGH_LAB_JSON: ${{ secrets.TOKEN_DAILY_LAUGH_LAB_JSON }}
          DAILY_LAUGH_THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_DAILY_LAUGH_LAB_ACCESS_TOKEN || secrets.DAILY_LAUGH_THREADS_ACCESS_TOKEN }}
          DAILY_LAUGH_THREADS_USERNAME: ${{ vars.DAILY_LAUGH_THREADS_USERNAME || 'dail.ylaughlab' }}
          DAILY_LAUGH_THREADS_USER_ID: ${{ vars.DAILY_LAUGH_THREADS_USER_ID }}
        run: python daily_laugh_deletion_preview.py
      - name: Preserve counts and fingerprints without content IDs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-laugh-deletion-preview
          path: daily-laugh-deletion-preview.json
          if-no-files-found: warn
          retention-days: 7
