name: Meta engagement independent account diagnostics
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  account-health:
    strategy:
      fail-fast: false
      matrix:
        account: [tarladaki, penguen, gonle, daily_laugh, film, toonzone]
    concurrency:
      group: engagement-health-${{ matrix.account }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      ENGAGEMENT_ACCOUNT: ${{ matrix.account }}
      META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify each account independently (no engagement POST)
        run: |
          python - <<'PY'
          import json, os
          account = os.environ['ENGAGEMENT_ACCOUNT']
          token_present = bool(os.getenv('META_ACCESS_TOKEN'))
          print(json.dumps({'account': account, 'token_present': token_present, 'action': 'health_check', 'likes_sent': 0}))
          if not token_present:
              raise SystemExit('META_ACCESS_TOKEN missing')
          PY
