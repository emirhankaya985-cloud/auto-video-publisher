name: Meta engagement independent account diagnostics
on:
  # Run a no-write acceptance check immediately after merging a diagnostic fix.
  push:
    branches: [main]
    paths:
      - 'meta_cross_engagement.py'
      - '.github/workflows/meta_engagement_isolated.yml'
  schedule:
    - cron: '10,25,40,55 * * * *'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  account-health:
    strategy:
      fail-fast: false
      matrix:
        include:
          - account: tarladaki
            focus: Tarladaki Fasulye
          - account: penguen
            focus: Beyinsiz Penguen
          - account: gonle
            focus: Gönle Düşen
          - account: daily_laugh
            focus: Daily Laugh Lab
          - account: film
            focus: Film Mağarası
          - account: toonzone
            focus: ToonZone
    concurrency:
      group: engagement-health-${{ matrix.account }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN_ID: latest
      ENGAGEMENT_SCOPE: recent_window
      ENGAGEMENT_MODE: dry_run
      GITHUB_EVENT_NAME: workflow_dispatch
      META_AUDIT_FOCUS: ${{ matrix.focus }}
      META_CROSS_ENGAGEMENT_ENABLED: 'false'
      META_CROSS_REPOST_ENABLED: 'false'
      META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
      ENABLE_TP_NORMAL_ROUTES: ${{ vars.ENABLE_TP_NORMAL_ROUTES }}
      ENABLE_GONLE_NORMAL_ROUTES: ${{ vars.ENABLE_GONLE_NORMAL_ROUTES }}
      ENABLE_GONLE_INSTAGRAM_ROUTES: ${{ vars.ENABLE_GONLE_INSTAGRAM_ROUTES }}
      ENABLE_DAILY_LAUGH_NORMAL_ROUTES: ${{ vars.ENABLE_DAILY_LAUGH_NORMAL_ROUTES }}
      ENABLE_DAILY_LAUGH_INSTAGRAM_ROUTES: ${{ vars.ENABLE_DAILY_LAUGH_INSTAGRAM_ROUTES }}
      ENABLE_FILM_ROUTES: ${{ vars.ENABLE_FILM_ROUTES }}
      FILM_RIGHTS_APPROVED: ${{ vars.FILM_RIGHTS_APPROVED }}
      ENABLE_TOONZONE_ROUTES: ${{ vars.ENABLE_TOONZONE_ROUTES }}
      ENABLE_NEW_META_ROUTES: ${{ vars.ENABLE_NEW_META_ROUTES }}
      META_NEW_ROUTES_RIGHTS_APPROVED: ${{ vars.META_NEW_ROUTES_RIGHTS_APPROVED }}
    steps:
      - name: Enforce start at 16:40 Türkiye time on 2026-11-10
        id: start_gate
        run: |
          python - <<'PY'
          from datetime import datetime, timezone
          from zoneinfo import ZoneInfo
          now = datetime.now(timezone.utc).astimezone(ZoneInfo('Europe/Istanbul'))
          if now.date().isoformat() == '2026-11-10' and (now.hour, now.minute) < (16, 40):
              raise SystemExit('Not started yet: 16:40 TRT')
          PY
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --require-hashes -r requirements.txt
      - name: Audit verified recent posts and existing ledger (read only)
        run: python meta_cross_engagement.py plan
      - name: Print per-account diagnostic summary
        if: always()
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p = Path('cross-engagement/report.json')
          summary = {'account': os.environ['META_AUDIT_FOCUS'], 'mode': 'read_only', 'likes_sent': 0}
          if p.exists():
              report = json.loads(p.read_text(encoding='utf-8'))
              for key in ('source_posts', 'planned', 'source_run_id', 'like_coverage', 'blocked_counts'):
                  if key in report:
                      summary[key] = report[key]
          else:
              summary['error'] = 'audit_report_missing'
          print(json.dumps(summary, ensure_ascii=False, default=str))
          PY
      - name: Archive per-account post and coverage audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: account-audit-${{ matrix.account }}
          path: |
            cross-engagement/report.json
            cross-engagement/plan.json
          if-no-files-found: warn
          retention-days: 30
