name: Tracked Meta route daily targets (read-only)

on:
  schedule:
    # Daily Laugh: 08:40 TRT, after yesterday's final 22:00 New York slot.
    - cron: '40 5 * * *'
    # ToonZone: 13:40 TRT, after four 12:00–12:30 Istanbul parts.
    - cron: '40 10 * * *'
  workflow_dispatch:
    inputs:
      route:
        description: Check only one route without any Meta writes
        type: choice
        required: true
        default: toonzone
        options: [toonzone, daily_laugh]

permissions:
  contents: read
  actions: read

concurrency:
  group: tracked-meta-route-deadline
  cancel-in-progress: false

jobs:
  check:
    if: vars.LINK_AUTOMATION_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GITHUB_TOKEN: ${{ github.token }}
      CORRELATE_PUBLISHER_ALERTS: true
      TARGET_ROUTE: ${{ inputs.route || (github.event.schedule == '40 10 * * *' && 'toonzone' || 'daily_laugh') }}
      META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
      # Same saved Page token inventory as publisher; counts still require live GETs.

      ENABLE_TOONZONE_ROUTES: ${{ vars.ENABLE_TOONZONE_ROUTES }}
      ENABLE_NEW_META_ROUTES: ${{ vars.ENABLE_NEW_META_ROUTES }}
      META_NEW_ROUTES_RIGHTS_APPROVED: ${{ vars.META_NEW_ROUTES_RIGHTS_APPROVED }}
      ENABLE_DAILY_LAUGH_NORMAL_ROUTES: ${{ vars.ENABLE_DAILY_LAUGH_NORMAL_ROUTES }}
      ENABLE_DAILY_LAUGH_INSTAGRAM_ROUTES: ${{ vars.ENABLE_DAILY_LAUGH_INSTAGRAM_ROUTES }}
      NTFY_TOPIC_URL: ${{ secrets.NTFY_TOPIC_URL }}
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install locked dependencies for read-only Meta history
        run: |
          python -m pip install --require-hashes -r requirements.txt
          python -m pip install gdown==6.4.2
      - name: Verify no-publish deadline checker
        run: python -m unittest -v test_tracked_meta_routes.py
      - name: Check verified Facebook and Instagram video goals and alert only on deficits
        run: python tracked_meta_routes.py
      - name: Preserve the actual target deficit even when duplicate phone alerts are suppressed
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tracked-route-verdict
          path: target-verdict.json
          if-no-files-found: ignore
          retention-days: 7
