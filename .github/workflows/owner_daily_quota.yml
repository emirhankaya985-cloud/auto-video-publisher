name: Seven-account daily quota ledger evidence (no posting)
on:
  schedule:
    # 23:39 TRT. Daily Laugh's last *completed* New York day is shown.
    - cron: '39 20 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'owner_daily_quota.py'
      - 'youtube_permission_circuit.py'
      - 'test_owner_daily_quota.py'
      - '.github/workflows/owner_daily_quota.yml'
  pull_request:
    paths:
      - 'owner_daily_quota.py'
      - 'youtube_permission_circuit.py'
      - 'test_owner_daily_quota.py'
      - '.github/workflows/owner_daily_quota.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: owner-seven-account-quota-readonly
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m unittest -v test_owner_daily_quota.py
  inspect:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install --require-hashes -r requirements.txt
      - name: Read only seven-account ledger; report missing counts as unverified
        run: python owner_daily_quota.py
      - name: Preserve read-only quota report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seven-account-daily-quota-readonly
          path: daily-quota-evidence.json
          if-no-files-found: warn
          retention-days: 30
