name: Film publication audit CI

on:
  pull_request:
    paths:
      - 'meta_connection_audit.py'
      - 'test_meta_connection_audit.py'
      - 'scheduled_multi_publisher.py'
      - 'test_film_part4_recovery.py'
      - '.github/workflows/meta_connection_audit.yml'
      - '.github/workflows/film_publication_audit_ci.yml'

permissions:
  contents: read

jobs:
  film-audit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: pip install --require-hashes -r requirements.txt
      - run: pip install PyYAML==6.0.2
      - run: python -m unittest discover -p 'test*.py'
