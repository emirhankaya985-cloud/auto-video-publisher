name: Public link Meta automation

on:
  schedule:
    # Normal checks every half hour; GitHub schedules may start late.
    - cron: '7,37 * * * *'
    # ToonZone: four parts at 12:00, 12:10, 12:20, 12:30 TRT (UTC+3).
    # The global concurrency group prevents overlapping publishing runs.
    - cron: '0,10,20,30 9 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: Audit sources and TXT without publishing, or publish due items
        type: choice
        required: true
        default: audit
        options: [audit, publish]

permissions:
  contents: read
  actions: read

concurrency:
  group: public-drive-recovery
  cancel-in-progress: false

jobs:
  meta:
    if: github.event_name == 'workflow_dispatch' || vars.LINK_AUTOMATION_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
      YOUTUBE_PUBLISHING_ENABLED: 'false'
      ENABLE_NEW_YOUTUBE_ROUTES: 'false'
      ENABLE_NEW_META_ROUTES: ${{ vars.ENABLE_NEW_META_ROUTES }}
      META_NEW_ROUTES_RIGHTS_APPROVED: ${{ vars.META_NEW_ROUTES_RIGHTS_APPROVED }}
      ENABLE_DAILY_LAUGH_INSTAGRAM_ROUTES: ${{ vars.ENABLE_DAILY_LAUGH_INSTAGRAM_ROUTES }}
      ENABLE_TP_NORMAL_ROUTES: ${{ vars.ENABLE_TP_NORMAL_ROUTES }}
      ENABLE_DAILY_LAUGH_NORMAL_ROUTES: ${{ vars.ENABLE_DAILY_LAUGH_NORMAL_ROUTES }}
      ENABLE_GONLE_NORMAL_ROUTES: ${{ vars.ENABLE_GONLE_NORMAL_ROUTES }}
      ENABLE_GONLE_INSTAGRAM_ROUTES: ${{ vars.ENABLE_GONLE_INSTAGRAM_ROUTES }}
      ENABLE_FILM_ROUTES: ${{ vars.ENABLE_FILM_ROUTES }}
      FILM_RIGHTS_APPROVED: ${{ vars.FILM_RIGHTS_APPROVED }}
      ENABLE_TOONZONE_ROUTES: ${{ vars.ENABLE_TOONZONE_ROUTES }}
      # Owner explicitly requested today's catch-up before the evening check.
      # Subsequent dates automatically return to the existing per-route times.
      COMPLETE_DAY_DATE: '2026-10-23'
      CATCHUP_BATCH_DATE: '2026-10-23'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install verified runtime
        run: |
          pip install --require-hashes -r requirements.txt
          pip install gdown==6.4.2
          command -v ffmpeg && command -v ffprobe || (sudo apt-get update -qq && sudo apt-get install -y ffmpeg)
      - name: Verify state, account and caption safety without API writes
        id: verify
        run: python -m unittest -v test_public_link_runtime.py
      - name: Check public folders, captions, histories and prepare intent
        id: plan
        env:
          MODE: ${{ inputs.mode || 'publish' }}
        run: |
          if [ "$MODE" = audit ]; then
            python public_link_runtime.py audit
          else
            python public_link_runtime.py plan
          fi
      - name: Persist intent before any Meta upload
        if: success() && (github.event_name == 'schedule' || inputs.mode == 'publish')
        uses: actions/upload-artifact@v4
        with:
          name: link-state-intent
          path: link-runtime/state.json
          if-no-files-found: error
          retention-days: 90
      - name: Publish explicitly planned Meta videos
        id: publish
        if: success() && (github.event_name == 'schedule' || inputs.mode == 'publish')
        run: python public_link_runtime.py publish
      - name: Preserve all results, including partial failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: link-state-result
          path: link-runtime/state.json
          if-no-files-found: ignore
          retention-days: 90
      - name: Save caption and account audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: link-caption-audit
          path: link-runtime/report.md
          if-no-files-found: ignore
          retention-days: 30
      - name: Generate per-run incident and recovery ledger (no API writes)
        if: always()
        continue-on-error: true
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: python publisher_incident_report.py
      - name: Persist incident report even after failed publishing
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: link-incident-report
          path: link-runtime/incidents.json
          if-no-files-found: warn
          retention-days: 90
      - name: Telegram confirmed publication and error summary (no uploads)
        # A failed Telegram push must not reclassify or retry a Meta publication.
        if: ${{ always() && (github.event_name == 'schedule' || inputs.mode == 'publish') }}
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          VERIFY_STEP_OUTCOME: ${{ steps.verify.outcome }}
          PLAN_STEP_OUTCOME: ${{ steps.plan.outcome }}
          PUBLISH_STEP_OUTCOME: ${{ steps.publish.outcome }}
        run: python telegram_publish_report.py
