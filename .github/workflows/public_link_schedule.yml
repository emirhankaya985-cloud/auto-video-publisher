name: Public link Meta automation

on:
  # Exact marker commit automatically runs a read-only audit; NEVER a publish.
  push:
    branches: [main]
    paths:
      - 'docs/publisher-safe-audit-2026-10-25.md'
      - 'docs/publisher-one-shot-v2-2026-10-25.md'
      - 'docs/ig-v3-rescue-once-2026-10-26.md'
      - 'docs/ig-v4-compact-publish-once-2026-10-26.md'
      # One date-bound, owner-authorized catch-up; re-running never republishes.
      - 'docs/owner-authorized-catchup-2026-11-01.md'
      - 'docs/owner-authorized-catchup-2026-11-02.md'
      - 'docs/owner-authorized-catchup-2026-11-07.md'
  schedule:
    # Normal checks every half hour; GitHub schedules may start late.
    - cron: '7,37 * * * *'
    # ToonZone: four parts at 12:00, 12:10, 12:20, 12:30 TRT (UTC+3).
    # The global concurrency group prevents overlapping publishing runs.
    - cron: '0,10,20,30 9 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: Audit sources and TXT without publishing, or publish due items
        type: choice
        required: true
        default: audit
        options: [audit, publish]

permissions:
  contents: read
  actions: read

concurrency:
  group: public-drive-recovery
  cancel-in-progress: false

jobs:
  meta:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || vars.LINK_AUTOMATION_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
      # A failed Film identity holds only Film. Every publishing route still
      # requires its own verified Page identity; no token/rights bypass.
      META_PREFLIGHT_PARTIAL_OK: 'true'
      MEDIA_QUALITY_ENABLED: ${{ vars.MEDIA_QUALITY_ENABLED != 'false' && 'true' || 'false' }}
      # Owner-requested rollout after offline and real FFmpeg acceptance.
      ADVANCED_DEDUPE_ENABLED: ${{ vars.ADVANCED_DEDUPE_ENABLED != 'false' && 'true' || 'false' }}
      AUTO_SUBTITLES_ENABLED: ${{ vars.AUTO_SUBTITLES_ENABLED == 'true' && 'true' || 'false' }}
      SUBTITLE_MODEL_DIR: ${{ github.workspace }}/speech-model
      ADAPTIVE_SCHEDULE_ENABLED: ${{ vars.ADAPTIVE_SCHEDULE_ENABLED != 'false' && 'true' || 'false' }}
      # Bounded two-item catch-up after 18:00; never bypasses per-route quota or safety locks.
      AUTO_BACKFILL_ENABLED: ${{ vars.AUTO_BACKFILL_ENABLED == 'true' && 'true' || 'false' }}
      # Only User token can discover verified Page tokens; invalid/expired token fails closed.
      # Owner deferred YouTube remediation; keep this production lane Meta-only.
      # Do not probe OAuth channels or enqueue YouTube intents until reauthorized.
      YOUTUBE_PUBLISHING_ENABLED: 'false'
      # Only after the owner has restored videos.insert permissions; never
      # a broad unbounded retry flag. New ID grants one source attempt.
      YOUTUBE_FORBIDDEN_RELEASE_ID: ${{ vars.YOUTUBE_FORBIDDEN_RELEASE_ID }}
      TOKEN_CHANNEL1_JSON: ${{ secrets.TOKEN_CHANNEL1_JSON }}
      TOKEN_CHANNEL2_JSON: ${{ secrets.TOKEN_CHANNEL2_JSON }}
      TOKEN_DAILY_LAUGH_LAB_JSON: ${{ secrets.TOKEN_DAILY_LAUGH_LAB_JSON }}
      TOKEN_GONLE_DUSEN_JSON: ${{ secrets.TOKEN_GONLE_DUSEN_JSON }}
      ENABLE_NEW_YOUTUBE_ROUTES: 'false'
      ENABLE_NEW_META_ROUTES: ${{ vars.ENABLE_NEW_META_ROUTES }}
      META_NEW_ROUTES_RIGHTS_APPROVED: ${{ vars.META_NEW_ROUTES_RIGHTS_APPROVED }}
      ENABLE_DAILY_LAUGH_INSTAGRAM_ROUTES: ${{ vars.ENABLE_DAILY_LAUGH_INSTAGRAM_ROUTES }}
      ENABLE_TP_NORMAL_ROUTES: ${{ vars.ENABLE_TP_NORMAL_ROUTES }}
      ENABLE_DAILY_LAUGH_NORMAL_ROUTES: ${{ vars.ENABLE_DAILY_LAUGH_NORMAL_ROUTES }}
      ENABLE_GONLE_NORMAL_ROUTES: ${{ vars.ENABLE_GONLE_NORMAL_ROUTES }}
      ENABLE_GONLE_INSTAGRAM_ROUTES: ${{ vars.ENABLE_GONLE_INSTAGRAM_ROUTES }}
      ENABLE_FILM_ROUTES: ${{ vars.ENABLE_FILM_ROUTES }}
      FILM_RIGHTS_APPROVED: ${{ vars.FILM_RIGHTS_APPROVED }}
      ENABLE_TOONZONE_ROUTES: ${{ vars.ENABLE_TOONZONE_ROUTES }}
      # Historical env kept for compatibility; owner-approved original PNG
      # is mandatory regardless of this value. Synthetic fallback is disabled.
      TOONZONE_AUTO_COVER_ENABLED: 'false'
      # Owner explicitly requested today's catch-up before the evening check.
      # Subsequent dates automatically return to the existing per-route times.
      COMPLETE_DAY_DATE: '2026-11-02'
      CATCHUP_BATCH_DATE: '2026-11-07'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install hash-pinned Meta read-only dependencies
        run: pip install --require-hashes -r requirements.txt
      - name: Fail early on invalid Meta credentials before any video work
        id: meta_preflight
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
        # Verify all expected Pages with User token and GETs before media preparation.
        run: python meta_page_token_health.py
      - name: Preserve rejected Meta preflight in structured incident journal
        # Do not retry Meta calls or turn a credential failure into a publish.
        # A sanitised event ensures link-error-journal exists when preflight fails.
        if: ${{ always() && steps.meta_preflight.outcome == 'failure' }}
        run: |
          python -c "from publisher_error_journal import record_error; record_error('workflow_verify', 'workflow_step_failed')"
      - name: Install media runtime only after Meta preflight passed
        timeout-minutes: 5
        run: |
          # The ToonZone original-PNG and first-frame gates require Pillow.
          pip install gdown==6.4.2 pillow==13.0.0
          python -c "from PIL import Image; print('ToonZone PNG decoder ready')"
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            # Reuse the bounded official-mirror setup from the ToonZone jobs.
            # A slow Azure mirror must not consume every pre-publication slot.
            echo 'https://archive.ubuntu.com/ubuntu' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
            echo 'https://security.ubuntu.com/ubuntu' | sudo tee /etc/apt/apt-mirrors-security.txt >/dev/null
            sudo apt-get -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 -o Acquire::Retries=1 update -qq
            sudo apt-get -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 -o Acquire::Retries=1 install -y --no-install-recommends ffmpeg
          fi
          command -v ffmpeg && command -v ffprobe
      - name: Verify one-shot commit authorization without any Meta writes
        id: release_gate
        env:
          REQUESTED_MODE: ${{ inputs.mode || 'audit' }}
        run: python publisher_one_shot_gate.py
      - name: Verify state, account and caption safety without API writes
        id: verify
        env:
          MEDIA_QUALITY_ENABLED: 'false'
          ADVANCED_DEDUPE_ENABLED: 'false'
          AUTO_SUBTITLES_ENABLED: 'false'
          ADAPTIVE_SCHEDULE_ENABLED: 'false'
        run: python -m unittest -v test_public_link_runtime.py
      - name: Restore next-day evidence for non-serial slots (fallback to current hours)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python -c "import os; from datetime import datetime, timezone; from adaptive_schedule import restore_schedule; print(restore_schedule('link-runtime/adaptive-schedule.json', token=os.environ['GITHUB_TOKEN'], now=datetime.now(timezone.utc)))"
      - name: Check public folders, captions, histories and prepare intent
        id: plan
        env:
          MODE: ${{ steps.release_gate.outputs.mode }}
          IG_AUDITED_RESCUE_ONLY: ${{ steps.release_gate.outputs.recovery_only }}
        run: |
          if [ "$MODE" = audit ]; then
            python public_link_runtime.py audit
          else
            python public_link_runtime.py plan
          fi
      - name: Prepare verified YouTube channel intents for current plans
        id: youtube_prepare
        if: success() && steps.release_gate.outputs.publish_allowed == 'true' && steps.release_gate.outputs.recovery_only != 'true' && env.YOUTUBE_PUBLISHING_ENABLED == 'true'
        continue-on-error: true
        run: python youtube_main_bridge.py prepare
      - name: Cache pinned local subtitle model
        if: success() && steps.release_gate.outputs.publish_allowed == 'true' && env.AUTO_SUBTITLES_ENABLED == 'true'
        uses: actions/cache@v4
        with:
          path: speech-model
          key: whisper-small-536b0662742c02347bc0e980a01041f333bce120
      - name: Prepare optional CPU subtitle runtime and fixed model
        if: success() && steps.release_gate.outputs.publish_allowed == 'true' && env.AUTO_SUBTITLES_ENABLED == 'true'
        continue-on-error: true
        timeout-minutes: 8
        run: |
          python -m pip install 'faster-whisper==1.2.1' 'huggingface-hub==0.34.4' 'av==15.1.0'
          python install_subtitle_model.py
      - name: Persist intent before any Meta upload
        id: intent_archive
        if: success() && steps.release_gate.outputs.publish_allowed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: link-state-intent
          path: link-runtime/state.json
          if-no-files-found: error
          retention-days: 90
      - name: Publish explicitly planned Meta videos
        id: publish
        if: success() && steps.release_gate.outputs.publish_allowed == 'true'
        run: python public_link_runtime.py publish
      - name: Publish planned YouTube videos with archived intent
        id: youtube_publish
        # This separate provider must never mark a successful Meta publish job
        # as failed. The actual outcome remains available as
        # steps.youtube_publish.outcome in the durable incident report.
        continue-on-error: true
        if: always() && steps.youtube_prepare.outcome == 'success' && steps.intent_archive.outcome == 'success' && steps.release_gate.outputs.publish_allowed == 'true'
        env:
          YOUTUBE_INTENT_ARCHIVED: 'true'
        run: python youtube_main_bridge.py publish
      - name: Back up state and verify current-run posts with read-only history
        id: post_verification
        if: always() && hashFiles('link-runtime/state.json') != ''
        run: python publication_operations.py --verify
      - name: Preserve checked backup and serial publication report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: publication-operations
          path: |
            link-runtime/operations-backup.zip
            link-runtime/operations-report.json
            link-runtime/content-stock.json
            link-runtime/quality/*.json
            link-runtime/subtitles/**
          if-no-files-found: ignore
          retention-days: 90
      - name: Preserve all results, including partial failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: link-state-result
          path: link-runtime/state.json
          if-no-files-found: ignore
          retention-days: 90
      - name: Archive validated ToonZone fallback artwork (no Drive writes)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: toonzone-generated-part-covers
          path: link-runtime/generated_toonzone_covers/*.png
          if-no-files-found: ignore
          retention-days: 90
      - name: Save caption and account audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: link-caption-audit
          path: link-runtime/report.md
          if-no-files-found: ignore
          retention-days: 30
      - name: Per-post Telegram and ntfy notification preparation (no sends)
        # A failed notification must never retry or reclassify a Meta publication.
        # A missing required delivery channel makes the WORKFLOW fail, never
        # reruns the successful Meta upload; later always() artifacts remain.
        if: ${{ always() && steps.release_gate.outputs.publish_allowed == 'true' }}
        id: notify_plan
        env:
          PUBLISH_ALERT_MODE: prepare
          PUBLISH_QUIET_FAILURES: 'true' # Owner opted out of failure push alerts; keep incident artifacts.
          REQUIRE_DUAL_NOTIFICATIONS: 'true'
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TOPIC_URL: ${{ secrets.NTFY_TOPIC_URL }}
          VERIFY_STEP_OUTCOME: ${{ steps.verify.outcome }}
          PLAN_STEP_OUTCOME: ${{ steps.plan.outcome }}
          PUBLISH_STEP_OUTCOME: ${{ steps.publish.outcome }}
        run: python telegram_publish_report.py
      - name: Persist notification intent before sending messages
        id: notify_intent
        if: ${{ always() && steps.notify_plan.outcome == 'success' && steps.notify_plan.outputs.alert_archive_needed == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: link-alert-intent
          path: link-runtime/alert-history.json
          if-no-files-found: error
          retention-days: 7
      - name: Send reserved notifications once (no video uploads)
        id: notify
        if: ${{ always() && steps.release_gate.outputs.publish_allowed == 'true' && steps.notify_plan.outcome == 'success' && (steps.notify_plan.outputs.alert_archive_needed != 'true' || steps.notify_intent.outcome == 'success') }}
        env:
          PUBLISH_ALERT_MODE: send
          ALERT_INTENT_ARCHIVED: ${{ steps.notify_intent.outcome == 'success' && 'true' || 'false' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TOPIC_URL: ${{ secrets.NTFY_TOPIC_URL }}
        run: python telegram_publish_report.py
      - name: Preserve notification results and server acknowledgements
        if: ${{ always() && steps.notify_plan.outputs.alert_archive_needed == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: link-alert-result
          path: link-runtime/alert-history.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Generate final per-run incident and recovery ledger (no API writes)
        if: always()
        # Evidence anomalies must fail the run, while subsequent always() steps
        # still preserve incident/error artifacts for forensic review.
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
          OUTCOME_PREFLIGHT: ${{ steps.meta_preflight.outcome }}
          OUTCOME_VERIFY: ${{ steps.verify.outcome }}
          OUTCOME_POST_VERIFICATION: ${{ steps.post_verification.outcome }}
          OUTCOME_YOUTUBE_PREPARE: ${{ steps.youtube_prepare.outcome }}
          OUTCOME_YOUTUBE_PUBLISH: ${{ steps.youtube_publish.outcome }}
          OUTCOME_PLAN: ${{ steps.plan.outcome }}
          OUTCOME_PUBLISH: ${{ steps.publish.outcome }}
          OUTCOME_NOTIFY: ${{ (steps.notify_plan.outcome == 'failure' || steps.notify_intent.outcome == 'failure' || steps.notify.outcome == 'failure') && 'failure' || steps.notify.outcome }}
        run: python publisher_incident_report.py
      - name: Preserve final incident report including notification failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: link-incident-report
          path: link-runtime/incidents.json
          if-no-files-found: warn
          retention-days: 90
      - name: Preserve every safe structured error event for the run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: link-error-journal
          path: link-runtime/errors.jsonl
          if-no-files-found: ignore
          retention-days: 90

      # YouTube failures are independently visible in youtube-accepted-audit
      # and the durable incident's youtube_prepare / youtube_publish outcomes.
      # Never turn a Meta-only publisher run red merely because a separate
      # Google identity is invalid; Meta safety and publish failures still fail.
