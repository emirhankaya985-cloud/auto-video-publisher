name: Buffer X integration offline CI
on:
  pull_request:
    paths:
      - 'buffer_x.py'
      - 'buffer_x_worker.py'
      - 'test_buffer_x.py'
      - 'test_buffer_x_worker.py'
      - 'migrations/20261126_buffer_x.sql'
      - 'BUFFER_X_INTEGRATION.md'
      - '.github/workflows/public_link_schedule.yml'
      - '.github/workflows/buffer_x_ci.yml'
permissions:
  contents: read
jobs:
  mock-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install 'requests==2.32.3'
      - run: python -m unittest -v test_buffer_x.py test_buffer_x_worker.py
