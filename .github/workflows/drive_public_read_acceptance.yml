name: Public Drive source read-only acceptance

on:
  pull_request:
    paths:
      - 'drive_public_read_probe.py'
      - '.github/workflows/drive_public_read_acceptance.yml'
      - 'public_link_runtime.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  read-only-real-drive:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install hash-pinned dependencies, no credentials
        run: |
          python -m pip install --require-hashes -r requirements.txt
          python -m pip install gdown==6.4.2
      - name: Verify Gone and ToonZone public GETs without Meta writes
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python drive_public_read_probe.py
