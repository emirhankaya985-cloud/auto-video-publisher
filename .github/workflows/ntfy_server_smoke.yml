name: One-time NTFY server receipt check

on:
  # The workflow is newly introduced by this PR. Its initial master merge
  # triggers exactly one test message; subsequent unrelated pushes do not.
  push:
    branches: [main]
    paths:
      - '.github/workflows/ntfy_server_smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ntfy-server-smoke
  cancel-in-progress: false

jobs:
  smoke:
    if: vars.AUTOMATION_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: pip install --require-hashes -r requirements.txt
      - name: Publish one short diagnostic message and validate ntfy receipt
        env:
          NTFY_TOPIC_URL: ${{ secrets.NTFY_TOPIC_URL }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python ntfy_smoke_test.py
