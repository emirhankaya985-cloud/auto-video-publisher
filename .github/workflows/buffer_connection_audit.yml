name: Buffer read-only connection audit

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'buffer_connection_audit.py'
      - 'test_buffer_connection_audit.py'
      - 'six_video_manifest_validator.py'
      - 'test_six_video_manifest_validator.py'
      - '.github/workflows/buffer_connection_audit.yml'

permissions:
  contents: read

concurrency:
  group: buffer-connection-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: pip install --require-hashes -r requirements.txt
      - run: python -m unittest -v test_buffer_connection_audit.py test_six_video_manifest_validator.py

  audit:
    if: github.event_name == 'workflow_dispatch' && github.repository == 'emirhankaya985-cloud/auto-video-publisher' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: pip install --require-hashes -r requirements.txt
      - name: Read Buffer organization and X channel metadata only
        env:
          BUFFER_API_KEY_1: ${{ secrets.BUFFER_API_KEY_1 }}
          BUFFER_X_CHANNELS_JSON: ${{ vars.BUFFER_X_CHANNELS_JSON }}
        run: python -u buffer_connection_audit.py
