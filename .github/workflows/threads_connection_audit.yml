name: Threads API account check (no publish)
on:
  workflow_dispatch:
    inputs:
      account:
        description: Verify all six or one Threads account without publishing
        required: true
        type: choice
        default: all
        options: [all, tarladaki, penguen, gonle, daily_laugh, film, toonzone]
  pull_request:
    paths:
      - 'threads_accounts.py'
      - 'check_threads_connection.py'
      - 'threads_publisher.py'
      - 'test_threads_accounts.py'
      - '.github/workflows/threads_connection_audit.yml'
  push:
    branches: [main]
    paths:
      - 'threads_accounts.py'
      - 'check_threads_connection.py'
      - 'threads_publisher.py'
      - 'test_threads_accounts.py'
      - '.github/workflows/threads_connection_audit.yml'
permissions:
  contents: read
jobs:
  mock-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: pip install --require-hashes -r requirements.txt
      - run: python -m unittest -v test_threads_accounts.py test_threads_publisher.py
  readonly-api:
    if: github.event_name == 'workflow_dispatch'
    needs: mock-tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: pip install --require-hashes -r requirements.txt
      - name: Compare selected token to Threads identity (GET only)
        env:
          THREADS_CHECK_ROUTE: ${{ inputs.account }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          TARLADAKI_THREADS_ACCESS_TOKEN: ${{ secrets.TARLADAKI_THREADS_ACCESS_TOKEN }}
          PENGUEN_THREADS_ACCESS_TOKEN: ${{ secrets.PENGUEN_THREADS_ACCESS_TOKEN }}
          GONLE_THREADS_ACCESS_TOKEN: ${{ secrets.GONLE_THREADS_ACCESS_TOKEN }}
          DAILY_LAUGH_THREADS_ACCESS_TOKEN: ${{ secrets.DAILY_LAUGH_THREADS_ACCESS_TOKEN }}
          FILM_THREADS_ACCESS_TOKEN: ${{ secrets.FILM_THREADS_ACCESS_TOKEN }}
          TOONZONE_THREADS_ACCESS_TOKEN: ${{ secrets.TOONZONE_THREADS_ACCESS_TOKEN }}
          TARLADAKI_THREADS_USERNAME: ${{ vars.TARLADAKI_THREADS_USERNAME }}
          PENGUEN_THREADS_USERNAME: ${{ vars.PENGUEN_THREADS_USERNAME }}
          GONLE_THREADS_USERNAME: ${{ vars.GONLE_THREADS_USERNAME }}
          DAILY_LAUGH_THREADS_USERNAME: ${{ vars.DAILY_LAUGH_THREADS_USERNAME }}
          FILM_THREADS_USERNAME: ${{ vars.FILM_THREADS_USERNAME }}
          TOONZONE_THREADS_USERNAME: ${{ vars.TOONZONE_THREADS_USERNAME }}
          TARLADAKI_THREADS_USER_ID: ${{ vars.TARLADAKI_THREADS_USER_ID }}
          PENGUEN_THREADS_USER_ID: ${{ vars.PENGUEN_THREADS_USER_ID }}
          GONLE_THREADS_USER_ID: ${{ vars.GONLE_THREADS_USER_ID }}
          DAILY_LAUGH_THREADS_USER_ID: ${{ vars.DAILY_LAUGH_THREADS_USER_ID }}
          FILM_THREADS_USER_ID: ${{ vars.FILM_THREADS_USER_ID }}
          TOONZONE_THREADS_USER_ID: ${{ vars.TOONZONE_THREADS_USER_ID }}
        run: python check_threads_connection.py
