name: Owner status-only Telegram inbox
on:
  schedule:
    - cron: '*/5 * * * *'
  push:
    branches: [main]
    paths: ['docs/telegram-status-plan-delivery-20261103.md']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: telegram-owner-single-consumer
  cancel-in-progress: false
jobs:
  inbox:
    if: vars.TELEGRAM_STATUS_INBOX_ENABLED != 'false' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GITHUB_TOKEN: ${{ github.token }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TELEGRAM_AI_OWNER_ID: ${{ secrets.TELEGRAM_AI_OWNER_ID }}
      PUBLISHER_VARS_JSON: ${{ toJSON(vars) }}
      TELEGRAM_STATUS_ONLY: 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: pip install --require-hashes -r requirements.txt
      - name: Prepare owner replies without sending or modifying publishing
        run: python telegram_status_inbox.py prepare
      - name: Persist processed offset before any Telegram reply
        if: always() && hashFiles('status-runtime/checkpoint-ready') != ''
        uses: actions/upload-artifact@v4
        with:
          name: telegram-status-checkpoint
          path: status-runtime/telegram.sqlite3
          if-no-files-found: error
          retention-days: 7
      - name: Send reserved replies once
        run: python telegram_status_inbox.py send
