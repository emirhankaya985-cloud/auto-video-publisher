name: Import verified publisher receipts to Neon

on:
  workflow_run:
    workflows: ["Public link Meta automation"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: read

concurrency:
  group: neon-publication-receipt-sync
  cancel-in-progress: false

jobs:
  sync:
    if: >-
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install locked repository dependencies
        run: pip install --require-hashes -r requirements.txt
      - name: Install pinned Neon PostgreSQL driver
        run: python -m pip install 'psycopg[binary]==3.2.9'
      - name: Import only verified, timestamped results from this run
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          DASHBOARD_DATABASE_URL: ${{ secrets.DASHBOARD_DATABASE_URL }}
        run: python neon_publication_sync.py
