name: Film Part 3 kurtarma güvenlik testleri

on:
  pull_request:
    paths:
      - 'scheduled_multi_publisher.py'
      - 'test_film_part3_recovery.py'
      - '.github/workflows/film_part3_recovery_ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  safety-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Dependencies
        run: |
          pip install --require-hashes -r requirements.txt
          pip install PyYAML==6.0.2
      - name: Run entire test suite without any API credentials
        run: python -m unittest discover -p 'test*.py'
