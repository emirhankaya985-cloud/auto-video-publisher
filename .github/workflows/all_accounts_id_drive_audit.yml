name: All accounts Meta post IDs vs Drive READ ONLY
on:
  push:
    branches: [main]
    paths:
      - all_accounts_id_drive_audit.py
      - test_all_accounts_id_drive_audit.py
      - .github/workflows/all_accounts_id_drive_audit.yml
  pull_request:
    paths:
      - all_accounts_id_drive_audit.py
      - test_all_accounts_id_drive_audit.py
      - .github/workflows/all_accounts_id_drive_audit.yml
  workflow_dispatch:
  schedule:
    - cron: '13 10 * * *'
permissions:
  contents: read
  actions: read
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify all-account read-only classification
        run: python -m unittest -v test_all_accounts_id_drive_audit.py
  provider-audit:
    needs: unit-tests
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install --require-hashes -r requirements.txt
      - run: python -m pip install gdown==6.4.2 pillow==13.0.0
      - name: GET-only exact Meta publication IDs and Drive MP4 names
        env:
          GITHUB_TOKEN: ${{ github.token }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
        run: python all_accounts_id_drive_audit.py
      - name: Archive each video classification for review without publishing
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: all-accounts-id-drive-readonly
          path: all-accounts-id-drive-readonly.json
          if-no-files-found: warn
          retention-days: 30
