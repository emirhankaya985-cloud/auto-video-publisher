name: Task 2 complete offline regression post-merge (zero publisher writes)

on:
  pull_request:
    paths:
      - '.github/workflows/task2_full_regression_ci.yml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/task2_full_regression_ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: task2-complete-offline-regression
  cancel-in-progress: false

jobs:
  complete-no-network:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      # Never forward any account credentials into the test process.
      PUBLISH_ACCOUNT_SCOPE: ''
      META_ACCESS_TOKEN: ''
      TELEGRAM_BOT_TOKEN: ''
      TELEGRAM_CHAT_ID: ''
      NTFY_TOPIC_URL: ''
      NTFY_TOPIC: ''
      DATABASE_URL: ''
      DASHBOARD_INGEST_URL: ''
      DASHBOARD_INGEST_TOKEN: ''
      ENABLE_FIXED_ACCOUNT_TXT: 'false'
      YOUTUBE_PUBLISHING_ENABLED: 'false'
      TIKTOK_PUBLISH_ENABLED: 'false'
      FILM_PART17_EXPIRED_RECOVERY_ENABLED: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install exact production hash-locked Python requirements
        run: python -m pip install --require-hashes -r requirements.txt
      - name: Install the existing test-only media and YAML parsers
        run: python -m pip install PyYAML==6.0.2 pillow==13.0.0 gdown==6.4.2
      - name: Compile Python source files, including the new evidence probes
        run: |
          python -m py_compile toonzone_direct_media_verifier.py film_part17_readonly_reconcile.py fixed_account_txt_readonly_audit.py notification_delivery_smoke.py youtube_authorize_channel.py
      - name: Run the entire Python unittest suite without publishing
        run: python -m unittest discover -v -p 'test*.py'
      - name: Run legacy migration acceptance regressions offline
        run: python migration_985_tests.py
      - name: Check the independent Cloudflare scheduler (no external API)
        run: node --test test/cloudflare_scheduler.test.mjs
