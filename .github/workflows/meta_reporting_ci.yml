name: Meta-only nightly reporting — no publish regression

on:
  pull_request:
    paths:
      - 'views_comparison.py'
      - 'test_views_comparison.py'
      - 'test_film_duplicate_identity.py'
      - 'stats_reporter.py'
      - 'public_link_runtime.py'
      - 'test_public_link_runtime.py'
      - 'instagram_media_compat.py'
      - 'test_instagram_media_compat.py'
      - 'tracked_meta_routes.py'
      - 'test_tracked_meta_routes.py'
      - '.github/workflows/tracked_meta_routes.yml'
      - 'analytics_github_history.py'
      - 'test_meta_reporting_independence.py'
      - '.github/workflows/daily_stats.yml'
      - '.github/workflows/daily_report_watch.yml'
      - '.github/workflows/meta_connection_audit.yml'
      - '.github/workflows/meta_reporting_ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  report-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install locked dependencies
        run: python -m pip install --require-hashes -r requirements.txt
      - name: Install existing test-only YAML parser
        run: python -m pip install PyYAML==6.0.2
      - name: Install production-matched read-only Drive metadata import
        run: python -m pip install gdown==6.4.2
      - name: Compile changed modules without secrets
        run: python -m py_compile stats_reporter.py analytics_github_history.py test_meta_reporting_independence.py
      - name: Run all unittest regressions, no outbound publishing
        run: python -m unittest discover -v -p 'test*.py'
      - name: Check publisher reconciliation regressions without Meta uploads
        run: python -m unittest -v test_public_link_runtime.py
      - name: Run full legacy-compatible migration acceptance suite (mocked)
        run: python migration_985_tests.py
      - name: Run Cloudflare scheduler simulated tests
        run: node --test test/cloudflare_scheduler.test.mjs
      - name: Check reporting & nightly workflow gates
        run: |
          python - <<'PYCODE'
          from pathlib import Path
          nightly = Path(".github/workflows/daily_stats.yml").read_text()
          watcher = Path(".github/workflows/daily_report_watch.yml").read_text()
          for text in (nightly, watcher):
              assert "vars.AUTOMATION_ENABLED" not in text
              assert "vars.META_REPORTING_ENABLED != 'false'" in text
          assert "paths: ['docs/meta-readonly-verification-2026-10-25.md']" in nightly
          assert "15 20 * * *" in nightly
          assert "10 4 * * *" in watcher
          assert "META_ONLY_REPORTING: 'true'" in nightly
          assert "meta-daily-analytics-history" in nightly
          assert "DRIVE_TOKEN_JSON:" not in nightly
          audit = Path(".github/workflows/meta_connection_audit.yml").read_text()
          assert "workflow_dispatch:" in audit
          assert "vars.AUTOMATION_ENABLED" not in audit
          assert "python meta_connection_audit.py" in audit
          assert "docs/meta-readonly-verification-2026-10-25.md" in audit
          assert "docs/meta-audit-recheck-2026-10-25.md" in audit
          assert "META_APP_ID" in audit and "token expiry remains unverified" in audit
          PYCODE
