name: Meta-only nightly reporting — no publish regression

on:
  pull_request:
    paths:
      - 'stats_reporter.py'
      - 'analytics_github_history.py'
      - 'test_meta_reporting_independence.py'
      - '.github/workflows/daily_stats.yml'
      - '.github/workflows/daily_report_watch.yml'
      - '.github/workflows/meta_reporting_ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  report-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install locked dependencies
        run: python -m pip install --require-hashes -r requirements.txt
      - name: Install existing test-only YAML parser
        run: python -m pip install PyYAML==6.0.2
      - name: Compile changed modules without secrets
        run: python -m py_compile stats_reporter.py analytics_github_history.py test_meta_reporting_independence.py
      - name: Run all unittest regressions, no outbound publishing
        run: python -m unittest discover -v -p 'test*.py'
      - name: Check reporting & nightly workflow gates
        run: |
          python - <<'PYCODE'
          from pathlib import Path
          nightly = Path(".github/workflows/daily_stats.yml").read_text()
          watcher = Path(".github/workflows/daily_report_watch.yml").read_text()
          for text in (nightly, watcher):
              assert "vars.AUTOMATION_ENABLED" not in text
              assert "vars.META_REPORTING_ENABLED != 'false'" in text
          assert "59 20 * * *" in nightly
          assert "10 4 * * *" in watcher
          assert "META_ONLY_REPORTING: 'true'" in nightly
          assert "meta-daily-analytics-history" in nightly
          assert "DRIVE_TOKEN_JSON:" not in nightly
          PYCODE
