name: Meta-only nightly reporting — no publish regression\n\non:\n  pull_request:\n    paths:\n      - 'nvidia_assistant.py'\n      - 'telegram_ai_worker.py'\n      - 'test_nvidia_assistant.py'\n      - 'views_comparison.py'\n      - 'test_views_comparison.py'\n      - 'test_film_duplicate_identity.py'\n      - 'meta_report_tables.py'\n      - 'test_meta_report_tables.py'\n      - 'publication_github_progress.py'\n      - 'test_publication_github_progress.py'\n      - 'stats_reporter.py'\n      - 'public_link_runtime.py'\n      - 'publisher_error_journal.py'\n      - 'test_publisher_error_journal.py'\n      - 'test_public_link_runtime.py'\n      - 'instagram_media_compat.py'\n      - 'test_instagram_media_compat.py'\n      - 'neon_archive_sync.py'\n      - 'test_neon_archive_sync.py'\n      - 'neon_publication_sync.py'\n      - 'test_neon_publication_sync.py'\n      - '.github/workflows/neon_publication_sync.yml'\n      - 'tracked_meta_routes.py'\n      - 'test_tracked_meta_routes.py'\n      - '.github/workflows/tracked_meta_routes.yml'\n      - 'analytics_github_history.py'\n      - 'test_meta_reporting_independence.py'\n      - '.github/workflows/daily_stats.yml'\n      - '.github/workflows/daily_report_watch.yml'\n      - '.github/workflows/meta_connection_audit.yml'\n      - '.github/workflows/meta_reporting_ci.yml'\n  workflow_dispatch:\n\npermissions:\n  contents: read\n\njobs:\n  report-regression:\n    runs-on: ubuntu-latest\n    timeout-minutes: 20\n    steps:\n      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262\n      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065\n        with:\n          python-version: '3.12'\n      - name: Install locked dependencies\n        run: python -m pip install --require-hashes -r requirements.txt\n      - name: Install existing test-only YAML parser\n        run: python -m pip install PyYAML==6.0.2 pillow==13.0.0\n      - name: Install production-matched read-only Drive metadata import\n        run: python -m pip install gdown==6.4.2\n      - name: Compile changed modules without secrets\n        run: python -m py_compile stats_reporter.py analytics_github_history.py test_meta_reporting_independence.py\n      - name: Run all unittest regressions, no outbound publishing\n        run: python -m unittest discover -v -p 'test*.py'\n      - name: Check publisher reconciliation regressions without Meta uploads\n        run: python -m unittest -v test_public_link_runtime.py\n      - name: Run full legacy-compatible migration acceptance suite (mocked)\n        run: python migration_985_tests.py\n      - name: Run Cloudflare scheduler simulated tests\n        run: node --test test/cloudflare_scheduler.test.mjs\n      - name: Check reporting & nightly workflow gates\n        run: |\n          python - <<'PYCODE'\n          from pathlib import Path\n          nightly = Path(".github/workflows/daily_stats.yml").read_text()\n          watcher = Path(".github/workflows/daily_report_watch.yml").read_text()\n          for text in (nightly, watcher):\n              assert "vars.AUTOMATION_ENABLED" not in text\n              assert "vars.META_REPORTING_ENABLED != 'false'" in text\n          assert "paths: ['docs/meta-readonly-verification-2026-10-25.md']" in nightly\n          assert "59 20 * * *" in nightly\n          assert "10 4 * * *" in watcher\n          assert "META_ONLY_REPORTING: 'true'" in nightly\n          assert "meta-daily-analytics-history" in nightly\n          assert "DRIVE_TOKEN_JSON:" not in nightly\n          audit = Path(".github/workflows/meta_connection_audit.yml").read_text()\n          assert "workflow_dispatch:" in audit\n          assert "vars.AUTOMATION_ENABLED" not in audit\n          assert "python meta_connection_audit.py" in audit\n          assert "docs/meta-readonly-verification-2026-10-25.md" in audit\n          assert "docs/meta-audit-recheck-2026-10-25.md" in audit\n          assert "META_APP_ID" in audit and "token expiry remains unverified" in audit\n          PYCODE\n