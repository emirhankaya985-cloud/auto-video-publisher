name: Legacy unresolved posts live READ ONLY acceptance
on:
  push:
    branches: [main]
    paths:
      - 'unresolved_live_probe.py'
      - 'test_unresolved_live_probe.py'
      - '.github/workflows/unresolved_live_probe.yml'
  workflow_dispatch:
  pull_request:
    paths:
      - 'unresolved_live_probe.py'
      - 'test_unresolved_live_probe.py'
      - '.github/workflows/unresolved_live_probe.yml'
permissions:
  contents: read
  actions: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install --require-hashes -r requirements.txt
      - run: python -m pip install gdown==6.4.2 pillow==13.0.0
      - run: python -m unittest -v test_unresolved_live_probe test_publication_operations
  measure:
    needs: tests
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install --require-hashes -r requirements.txt
      - run: python -m pip install gdown==6.4.2 pillow==13.0.0
      - name: GET past Meta containers and live history, no provider writes
        env:
          GITHUB_TOKEN: ${{ github.token }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
        run: python unresolved_live_probe.py
      - name: Preserve read-only evidence or explicit failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unresolved-live-readonly
          path: unresolved-live-readonly.json
          if-no-files-found: warn
          retention-days: 30
