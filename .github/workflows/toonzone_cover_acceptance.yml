name: ToonZone exact 36 cover PNG integrity (read only)
on:
  pull_request:
    paths:
      - 'toonzone_cover_acceptance.py'
      - 'test_toonzone_cover_acceptance.py'
      - '.github/workflows/toonzone_cover_acceptance.yml'
  push:
    branches: [main]
    paths:
      - 'toonzone_cover_acceptance.py'
      - 'test_toonzone_cover_acceptance.py'
      - '.github/workflows/toonzone_cover_acceptance.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: toonzone-36-cover-readonly-acceptance
  cancel-in-progress: false
jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: |
          pip install --require-hashes -r requirements.txt
          pip install pillow==13.0.0
      - run: python -m unittest -v test_toonzone_cover_acceptance.py
  live-verify-png-bytes:
    needs: tests
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: |
          pip install --require-hashes -r requirements.txt
          pip install gdown==6.4.2 pillow==13.0.0
      - name: Download and check 36 exact Drive PNGs - NO social POST, NO alerts
        run: python toonzone_cover_acceptance.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: toonzone-36-cover-byte-acceptance
          path: toonzone-cover-acceptance/result.json
          if-no-files-found: error
          retention-days: 90
