name: Owner requested Telegram Threads button test
on:
  push:
    branches: [main]
    paths: ['.github/workflows/telegram-threads-button-smoke-20261104.yml']
permissions:
  contents: read
jobs:
  send-once:
    if: github.repository == 'emirhankaya985-cloud/auto-video-publisher' && github.event.before == '6a19558fd9e0097d14fe1d82851a2834462251c6' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: pip install --require-hashes -r requirements.txt
      - name: Send the owner one clearly labelled test
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import json
          from telegram_notifications import STATISTICS_KEYBOARD, send_telegram

          receipt = send_telegram(
              "🧪 Threads bildirim denemesi",
              'Hesap: <a href="https://www.threads.com/@dail.ylaughlab">Daily Laugh Lab (@dail.ylaughlab)</a>\n'
              'Son izlenme raporunu görmek için aşağıdaki 📊 İstatistik butonuna dokun.',
              parse_mode="HTML",
              reply_markup=STATISTICS_KEYBOARD,
          )
          print(json.dumps({"server_ack": receipt["server_ack"], "test_messages": 1}))
          PY
