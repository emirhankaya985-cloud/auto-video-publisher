name: ToonZone 15-minute daily video review (Telegram only)
on:
  schedule:
    # 15:00–16:30 Istanbul, seven 15-minute slots. UTC+3 year-round.
    - cron: '0,15,30,45 12 * * *'
    - cron: '0,15,30 13 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - toonzone_daily_review.py
      - test_toonzone_daily_review.py
      - .github/workflows/toonzone_daily_review.yml
permissions:
  contents: read
concurrency:
  group: toonzone-daily-review
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: pip install --require-hashes -r requirements.txt
      - run: python -m unittest -v test_toonzone_daily_review.py
  review:
    needs: test
    if: github.event_name == 'schedule' && github.ref == 'refs/heads/main' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TOONZONE_REVIEW_NOTIFICATIONS_ENABLED: ${{ vars.TOONZONE_REVIEW_NOTIFICATIONS_ENABLED || 'true' }}
      GITHUB_EVENT_NAME: ${{ github.event_name }}
      GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: pip install --require-hashes -r requirements.txt
      - run: python toonzone_daily_review.py
