name: ToonZone 15-minute daily video review (Telegram only)
on:
  schedule:
    # 15:00–16:30 Istanbul, seven 15-minute slots. UTC+3 year-round.
    - cron: '0,15,30,45 12 * * *'
    - cron: '0,15,30 13 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - toonzone_daily_review.py
      - test_toonzone_daily_review.py
      - sequential_toonzone_review.py
      - test_sequential_toonzone_review.py
      - .github/workflows/toonzone_daily_review.yml
permissions:
  contents: read
  actions: read
concurrency:
  group: toonzone-daily-review-ledger
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: pip install --require-hashes -r requirements.txt
      - run: python -m unittest -v test_toonzone_daily_review.py test_sequential_toonzone_review.py
  review:
    needs: test
    if: github.event_name == 'schedule' && github.ref == 'refs/heads/main' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
      # ToonZone Threads discovery is identity-checked and read-only.
      TOONZONE_THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_TOONZONE_ACCESS_TOKEN || secrets.TOONZONE_THREADS_ACCESS_TOKEN }}
      TOONZONE_THREADS_USERNAME: ${{ vars.TOONZONE_THREADS_USERNAME || 'toonzone.tr' }}
      TOONZONE_THREADS_USER_ID: ${{ vars.TOONZONE_THREADS_USER_ID }}
      # Source-account platform detection: only configured Threads accounts qualify.
      TARLADAKI_THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_TARLADAKI_FASULYE_ACCESS_TOKEN || secrets.TARLADAKI_THREADS_ACCESS_TOKEN }}
      TARLADAKI_THREADS_USERNAME: ${{ vars.TARLADAKI_THREADS_USERNAME || 'tarladakifasulye_' }}
      PENGUEN_THREADS_ACCESS_TOKEN: ${{ secrets.PENGUEN_THREADS_ACCESS_TOKEN || secrets.THREADS_ACCESS_TOKEN }}
      PENGUEN_THREADS_USERNAME: ${{ vars.PENGUEN_THREADS_USERNAME || 'beyinsiz.penguen' }}
      GONLE_THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_GONLE_DUSEN_ACCESS_TOKEN || secrets.GONLE_THREADS_ACCESS_TOKEN }}
      GONLE_THREADS_USERNAME: ${{ vars.GONLE_THREADS_USERNAME || 'gonl_edusen' }}
      DAILY_LAUGH_THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_DAILY_LAUGH_LAB_ACCESS_TOKEN || secrets.DAILY_LAUGH_THREADS_ACCESS_TOKEN }}
      DAILY_LAUGH_THREADS_USERNAME: ${{ vars.DAILY_LAUGH_THREADS_USERNAME || 'dail.ylaughlab' }}
      FILM_THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_FILM_MAGARASI_ACCESS_TOKEN || secrets.FILM_THREADS_ACCESS_TOKEN }}
      FILM_THREADS_USERNAME: ${{ vars.FILM_THREADS_USERNAME || 'film_magrasi' }}

      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TOONZONE_REVIEW_NOTIFICATIONS_ENABLED: ${{ vars.TOONZONE_REVIEW_NOTIFICATIONS_ENABLED || 'true' }}
      GITHUB_EVENT_NAME: ${{ github.event_name }}
      GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      GITHUB_REF: ${{ github.ref }}
      GITHUB_RUN_ID: ${{ github.run_id }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: pip install --require-hashes -r requirements.txt
      - name: Restore prior stage and reserve the next stage
        run: python sequential_toonzone_review.py prepare
      - name: Persist intent before any Telegram request
        id: intent
        uses: actions/upload-artifact@v4
        with:
          name: toonzone-sequence-intent
          path: toonzone-sequence/alert-history.json
          if-no-files-found: error
          retention-days: 30
      - name: Send exactly one staged Telegram review after intent is archived
        env:
          TOONZONE_INTENT_ARCHIVED: ${{ steps.intent.outcome == 'success' && 'true' || 'false' }}
        run: python sequential_toonzone_review.py send
      - name: Persist outcome (including uncertain results)
        if: always() && steps.intent.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: toonzone-sequence-result
          path: toonzone-sequence/alert-history.json
          if-no-files-found: error
          retention-days: 30
