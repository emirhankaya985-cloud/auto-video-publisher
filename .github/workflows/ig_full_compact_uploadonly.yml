name: Film ToonZone full compact 180s IG upload-only (NO publish)
on:
  push:
    branches: [main]
    paths:
      - 'docs/ig-full-compact-uploadonly-2026-10-26.md'
permissions:
  contents: read

concurrency:
  group: ig-180s-uploadonly-no-publish
  cancel-in-progress: false

jobs:
  compact-unpublished:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install locked requirements and ffmpeg
        run: |
          pip install --require-hashes -r requirements.txt
          pip install gdown==6.4.2
          command -v ffmpeg && command -v ffprobe || (sudo apt-get update -qq && sudo apt-get install -y ffmpeg)
      - name: Fail-closed mock security tests
        run: python -m unittest -v test_ig_full_compact_uploadonly_diagnostic.py
      - name: Evaluate two full-length 360p clips without publishing
        env:
          IG_FULL_COMPACT_APPROVED: 'true'
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_AUTH_JSON: ${{ secrets.META_AUTH_JSON }}
          ENABLE_FILM_ROUTES: ${{ vars.ENABLE_FILM_ROUTES }}
          FILM_RIGHTS_APPROVED: ${{ vars.FILM_RIGHTS_APPROVED }}
          ENABLE_TOONZONE_ROUTES: ${{ vars.ENABLE_TOONZONE_ROUTES }}
          ENABLE_NEW_META_ROUTES: ${{ vars.ENABLE_NEW_META_ROUTES }}
          META_NEW_ROUTES_RIGHTS_APPROVED: ${{ vars.META_NEW_ROUTES_RIGHTS_APPROVED }}
        run: python ig_full_compact_uploadonly_diagnostic.py
      - name: Preserve sanitized result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: film-toonzone-180s-compact-uploadonly-no-publish
          path: ig-full-compact-uploadonly-result.json
          retention-days: 30
          if-no-files-found: ignore
