name: TikTok connection prerequisites - read-only no uploads
on:
  push:
    branches: [main]
    paths:
      - 'tiktok_preflight.py'
      - 'tiktok_post_status.py'
      - 'test_tiktok_post_status.py'
      - '.github/workflows/tiktok_preflight_readonly.yml'
  pull_request:
    paths:
      - 'tiktok_preflight.py'
      - 'tiktok_post_status.py'
      - 'test_tiktok_post_status.py'
      - 'test_tiktok_preflight.py'
      - '.github/workflows/tiktok_preflight_readonly.yml'
  workflow_dispatch:
    inputs:
      publish_id:
        description: Existing TikTok publish_id to reconcile (read-only, no upload)
        required: false
        type: string
permissions:
  contents: read
jobs:
  readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TIKTOK_ACCESS_TOKEN: ${{ secrets.TIKTOK_ACCESS_TOKEN }}
      TIKTOK_OPEN_ID: ${{ secrets.TIKTOK_OPEN_ID }}
      TIKTOK_APP_AUDITED: ${{ vars.TIKTOK_APP_AUDITED }}
      TIKTOK_PUBLISH_ENABLED: ${{ vars.TIKTOK_PUBLISH_ENABLED }}
      TIKTOK_PREFLIGHT_PROBE_ENABLED: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install hash-pinned read-only dependencies
        run: python -m pip install --require-hashes -r requirements.txt
      - name: Emit only boolean readiness without contacting TikTok
        run: python tiktok_preflight.py
      - name: Verify fail-closed behavior and never publish
        run: python -m unittest -v test_tiktok_preflight.py test_tiktok_post_status.py
      - name: Read existing TikTok publish status only when explicitly requested
        if: github.event_name == 'workflow_dispatch' && inputs.publish_id != ''
        env:
          TIKTOK_STATUS_PROBE_ENABLED: 'true'
          TIKTOK_PUBLISH_ID: ${{ inputs.publish_id }}
        run: python tiktok_preflight.py --status-publish-id "$TIKTOK_PUBLISH_ID"
