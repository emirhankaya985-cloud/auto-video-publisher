name: Read-only Meta Page Token Health

permissions:
  contents: read

on:
  workflow_dispatch:
  pull_request:
    paths:
      - meta_page_token_health.py
      - test_meta_page_token_health.py
      - .github/workflows/meta_page_token_health.yml

jobs:
  tests:
    if: vars.AUTOMATION_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: pip install --require-hashes -r requirements.txt
      - run: python -m unittest -v test_meta_page_token_health.py

  audit:
    if: >-
      vars.AUTOMATION_ENABLED == 'true' &&
      (github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: pip install --require-hashes -r requirements.txt
      - name: Check saved page token identities only
        env:
          META_AUTH_JSON: ${{ secrets.META_AUTH_JSON }}
        run: python meta_page_token_health.py
