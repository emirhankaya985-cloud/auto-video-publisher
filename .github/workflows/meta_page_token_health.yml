name: Read-only Meta Page Token Health

permissions:
  contents: read

on:
  workflow_dispatch:
  # One-shot auth diagnosis after the reviewed safe patch is merged to main.
  # No Meta POST, video upload, credentials logging or secret mutation.
  push:
    branches: [main]
    paths:
      - docs/meta-auth-readonly-proof-2026-10-31.md
  pull_request:
    paths:
      - meta_page_token_health.py
      - test_meta_page_token_health.py
      - .github/workflows/meta_page_token_health.yml

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: pip install --require-hashes -r requirements.txt
      - run: python -m unittest -v test_meta_page_token_health.py

  audit:
    if: >-
      (github.event_name == 'workflow_dispatch' || github.event_name == 'push') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: pip install --require-hashes -r requirements.txt
      - name: Check token-discovered Page identities only
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
        run: python meta_page_token_health.py
