name: Daily report missed-run watchdog

on:
  # Daily report is expected at 20:59 UTC (23:59 TRT).
  # Check the next morning at 04:10 UTC (07:10 TRT), after queue grace.
  schedule:
    - cron: '10 4 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: ntfy-daily-report-missed-run-watch
  cancel-in-progress: false

jobs:
  verify-previous-night:
    if: vars.AUTOMATION_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: pip install --require-hashes -r requirements.txt
      - name: Verify scheduled prior-night daily report and alert only if missing
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NTFY_TOPIC_URL: ${{ secrets.NTFY_TOPIC_URL }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python ntfy_daily_schedule_watch.py
