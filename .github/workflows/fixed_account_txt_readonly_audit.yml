name: Owner fixed TXT original public Drive metadata audit (no posts)

on:
  pull_request:
    paths:
      - account_fixed_txt.py
      - fixed_account_txt_readonly_audit.py
      - test_fixed_account_txt_readonly_audit.py
      - .github/workflows/fixed_account_txt_readonly_audit.yml
  push:
    branches: [main]
    paths:
      - fixed_account_txt_readonly_audit.py
      - test_fixed_account_txt_readonly_audit.py
      - .github/workflows/fixed_account_txt_readonly_audit.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  mocked-ownership-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: pip install --require-hashes -r requirements.txt
      - run: pip install gdown==6.4.2 pillow==13.0.0
      - run: python -m unittest -v test_account_fixed_txt.py test_fixed_account_txt_readonly_audit.py

  original-source-readonly:
    needs: mocked-ownership-tests
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 13
    env:
      FIXED_TARLADAKI_TXT_SHA256: ${{ vars.FIXED_TARLADAKI_TXT_SHA256 }}
      FIXED_PENGUEN_TXT_SHA256: ${{ vars.FIXED_PENGUEN_TXT_SHA256 }}
      FIXED_GONLE_TXT_SHA256: ${{ vars.FIXED_GONLE_TXT_SHA256 }}
      FIXED_DAILY_LAUGH_TXT_SHA256: ${{ vars.FIXED_DAILY_LAUGH_TXT_SHA256 }}
      YOUTUBE_PUBLISHING_ENABLED: 'false'
      ENABLE_FIXED_ACCOUNT_TXT: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: pip install --require-hashes -r requirements.txt
      - run: pip install gdown==6.4.2 pillow==13.0.0
      - name: Read only exact account-owned TXT names and compare pins
        run: python fixed_account_txt_readonly_audit.py
      - name: Preserve redacted source evidence, never the contents
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: original-account-fixed-txt-source-evidence
          path: fixed-txt-readonly-audit/result.json
          if-no-files-found: warn
          retention-days: 30
