name: Meta publisher health watchdog

on:
  # At 11:40 TRT, verify real scheduled jobs from the preceding 3 hours.
  # Once daily to avoid repeated phone alerts for the same outage.
  schedule:
    - cron: '40 8 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: meta-publisher-health-watchdog
  cancel-in-progress: false

jobs:
  health:
    if: github.event_name == 'workflow_dispatch' || vars.LINK_AUTOMATION_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install verified runtime
        run: pip install --require-hashes -r requirements.txt
      - name: Verify scheduled Meta runs and alert on persistent failure
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NTFY_TOPIC_URL: ${{ secrets.NTFY_TOPIC_URL }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python public_link_health.py
