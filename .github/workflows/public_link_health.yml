name: Meta publisher health watchdog

on:
  push:
    branches: [main]
    paths:
      - 'public_link_health.py'
      - 'public_link_runtime.py'
      - '.github/workflows/public_link_health.yml'
  # Owner 20 Nov: repeat unresolved Meta outage alerts every ten minutes.
  # GitHub may delay cron starts; this is not a hard real-time SLA.
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: meta-publisher-health-watchdog
  cancel-in-progress: false

jobs:
  health:
    if: github.event_name == 'workflow_dispatch' || vars.LINK_AUTOMATION_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install verified runtime
        run: pip install --require-hashes -r requirements.txt
      - name: Verify scheduled Meta runs and alert on persistent failure
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CORRELATE_PUBLISHER_ALERTS: true
          META_OUTAGE_REPEAT_ALERTS: 'true'
          NTFY_TOPIC_URL: ${{ secrets.NTFY_TOPIC_URL }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python public_link_health.py
