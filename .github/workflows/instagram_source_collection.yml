name: Instagram source video collection

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: instagram-source-collection
  cancel-in-progress: false

jobs:
  collect:
    # Global switch is an explicit owner opt-in. Every target and every source
    # has additional independent disabled-by-default switches in JSON config.
    if: >-
      github.ref == 'refs/heads/main' &&
      vars.IG_SOURCE_COLLECTION_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install existing pinned repository dependencies
        run: pip install --require-hashes -r requirements.txt
      - name: Install the existing Neon PostgreSQL driver
        run: python -m pip install 'psycopg[binary]==3.2.9'
      - name: Install FFprobe for source video validation
        timeout-minutes: 5
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffprobe -version | head -n 1
      - name: Collect all eligible source videos to isolated Drive intake folders
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          IG_SOURCE_DISCOVERY_ACTOR_ID: ${{ vars.IG_SOURCE_DISCOVERY_ACTOR_ID }}
          DRIVE_TOKEN_JSON: ${{ secrets.DRIVE_TOKEN_JSON }}
          DASHBOARD_DATABASE_URL: ${{ secrets.DASHBOARD_DATABASE_URL }}
        run: python instagram_source_collection.py
