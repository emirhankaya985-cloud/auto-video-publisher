name: ToonZone Instagram cover and restart readiness
on:
  push:
    branches: [main]
    paths: ['docs/toonzone-instagram-restart-audit-2026-11-05.md']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: toonzone-instagram-readonly-readiness
  cancel-in-progress: false
jobs:
  audit:
    if: github.repository == 'emirhankaya985-cloud/auto-video-publisher' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: |
          pip install --require-hashes -r requirements.txt
          pip install gdown==6.4.2
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
      - run: python -m py_compile toonzone_instagram_restart_audit.py
      - name: Verify actual covers and current Instagram media without publishing
        run: python toonzone_instagram_restart_audit.py
      - name: Preserve cover and existing-post evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: toonzone-instagram-restart-readiness
          path: toonzone-instagram-restart-audit/
          if-no-files-found: warn
          retention-days: 90
