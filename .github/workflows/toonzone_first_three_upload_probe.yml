name: ToonZone first-part upload-only diagnostic
on:
  push:
    branches: [main]
    paths: ['.github/workflows/toonzone_first_three_upload_probe.yml']
permissions:
  contents: read
  actions: read
jobs:
  probe:
    if: github.repository == 'emirhankaya985-cloud/auto-video-publisher' && github.ref == 'refs/heads/main' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - timeout-minutes: 5
        run: |
          pip install --require-hashes -r requirements.txt
          pip install gdown==6.4.2 pillow==13.0.0
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get -o Acquire::http::Timeout=20 -o Acquire::Retries=1 update -qq
            sudo apt-get -o Acquire::http::Timeout=20 -o Acquire::Retries=1 install -y --no-install-recommends ffmpeg
          fi
      - run: python toonzone_first_three_upload_probe.py prepare
      - id: intent
        uses: actions/upload-artifact@v4
        with:
          name: toonzone-first-three-upload-probe-intent
          path: toonzone-first-three-upload-probe/alert-history.json
          if-no-files-found: error
          retention-days: 90
      - name: Upload alternate bitstream without any publication
        env:
          UPLOAD_PROBE_INTENT_ARCHIVED: ${{ steps.intent.outcome == 'success' && 'true' || 'false' }}
        run: python toonzone_first_three_upload_probe.py upload
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: toonzone-first-three-upload-probe-result
          path: toonzone-first-three-upload-probe/alert-history.json
          if-no-files-found: warn
          retention-days: 90
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: toonzone-first-three-upload-probe-cover
          path: toonzone-first-three-upload-probe/prepared.jpg
          if-no-files-found: warn
          retention-days: 90
