name: Migrate retained analytics history to Neon

on:
  workflow_dispatch:
    inputs:
      max_runs:
        description: Maximum successful daily-report runs to inspect (up to 100)
        required: false
        default: "100"
        type: string

permissions:
  contents: read
  actions: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install locked dependencies
        run: pip install --require-hashes -r requirements.txt
      - name: Import retained successful artifacts
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          DASHBOARD_MIGRATION_RUNS: ${{ inputs.max_runs }}
          DASHBOARD_INGEST_URL: ${{ secrets.DASHBOARD_INGEST_URL }}
          DASHBOARD_INGEST_TOKEN: ${{ secrets.DASHBOARD_INGEST_TOKEN }}
        run: python dashboard_history_migrate.py
