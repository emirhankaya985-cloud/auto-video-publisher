name: Meta cross-account engagement
on:
  schedule:
    # One target account per tick, individually verified/ledgered likes on all recent posts.
    # Every 15 minutes; GitHub can delay scheduled starts.
    # Never bulk-like, save or repost. Provider restrictions remain authoritative.
    - cron: '7,22,37,52 * * * *'
  push:
    branches: [main]
    # Code changes trigger only read-only diagnostics.
    paths:
      - 'docs/meta-cross-engagement-live-2026-11-08.md'
      - 'docs/meta-cross-engagement-owner-start-2026-11-10.md'
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Source run ID or latest (processes all native posts in the last 24 hours)
        required: false
        default: latest
        type: string
  pull_request:
    paths:
      - 'meta_cross_engagement.py'
      - 'test_meta_cross_engagement.py'
      - 'meta_cross_engagement_receipts.py'
      - 'test_meta_cross_engagement_receipts.py'
      - '.github/workflows/meta_cross_engagement.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: meta-cross-engagement-ledger
  cancel-in-progress: false
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: pip install --require-hashes -r requirements.txt
      - name: Verify identities, unsupported actions, dedupe and crash safety with mocks
        run: python -m unittest -v test_meta_cross_engagement.py test_meta_cross_engagement_receipts.py
  engage:
    needs: tests
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || github.event_name == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN_ID: ${{ inputs.source_run_id || 'latest' }}
      ENGAGEMENT_SCOPE: recent_window
      # All triggers remain read-only; no API engagement writes are supported.
      META_AUDIT_FOCUS: ${{ github.event_name == 'workflow_dispatch' && 'ToonZone' || '' }}

      META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
      ENABLE_TP_NORMAL_ROUTES: ${{ vars.ENABLE_TP_NORMAL_ROUTES }}
      ENABLE_GONLE_NORMAL_ROUTES: ${{ vars.ENABLE_GONLE_NORMAL_ROUTES }}
      ENABLE_GONLE_INSTAGRAM_ROUTES: ${{ vars.ENABLE_GONLE_INSTAGRAM_ROUTES }}
      ENABLE_DAILY_LAUGH_NORMAL_ROUTES: ${{ vars.ENABLE_DAILY_LAUGH_NORMAL_ROUTES }}
      ENABLE_DAILY_LAUGH_INSTAGRAM_ROUTES: ${{ vars.ENABLE_DAILY_LAUGH_INSTAGRAM_ROUTES }}
      ENABLE_FILM_ROUTES: ${{ vars.ENABLE_FILM_ROUTES }}
      FILM_RIGHTS_APPROVED: ${{ vars.FILM_RIGHTS_APPROVED }}
      ENABLE_TOONZONE_ROUTES: ${{ vars.ENABLE_TOONZONE_ROUTES }}
      ENABLE_NEW_META_ROUTES: ${{ vars.ENABLE_NEW_META_ROUTES }}
      META_NEW_ROUTES_RIGHTS_APPROVED: ${{ vars.META_NEW_ROUTES_RIGHTS_APPROVED }}
      META_CROSS_REPOST_ENABLED: 'false'
      # Task 7.3: every trigger is a read-only health audit.
      GITHUB_EVENT_NAME: workflow_dispatch
      GITHUB_REF: ${{ github.ref }}
      ENGAGEMENT_MODE: dry_run
      META_CROSS_ENGAGEMENT_ENABLED: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: pip install --require-hashes -r requirements.txt
      - name: Read recent publisher results and verified actor identities; prepare independent ledger
        run: python meta_cross_engagement.py plan
      - name: Verify read-only audit mode
        run: python -c "import os; assert os.environ['ENGAGEMENT_MODE'] == 'dry_run' and os.environ['META_CROSS_ENGAGEMENT_ENABLED'] == 'false'"
      - name: Preserve independent engagement ledger including partial results
        id: verified_ledger
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cross-engagement-result
          path: cross-engagement/engagement.json
          if-no-files-found: ignore
          retention-days: 90
      - name: Publish read-only audit summary
        if: always()
        env:
          ENGAGEMENT_MODE_ACTUAL: ${{ env.ENGAGEMENT_MODE }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          ledger_path = Path("cross-engagement/engagement.json")
          report_path = Path("cross-engagement/report.json")
          accepted = {"instagram": None, "facebook": None}
          state = "UNKNOWN_NO_LEDGER"
          if ledger_path.is_file():
              try:
                  ledger = json.loads(ledger_path.read_text(encoding="utf-8"))
                  actions = ledger.get("actions", {})
                  if not isinstance(actions, dict):
                      raise ValueError("invalid actions")
                  accepted = {"instagram": 0, "facebook": 0}
                  for record in actions.values():
                      if not isinstance(record, dict):
                          continue
                      platform = record.get("platform")
                      if (platform in accepted and record.get("operation") == "like"
                              and record.get("status") == "accepted"
                              and record.get("api_ack") is True):
                          accepted[platform] += 1
                  state = "GRAPH_ACK_PRESENT" if sum(accepted.values()) else "NO_ACCEPTED_GRAPH_ACK"
              except (OSError, ValueError, TypeError, AttributeError):
                  state = "INVALID_LEDGER"
          planned = "unknown"
          if report_path.is_file():
              try:
                  report = json.loads(report_path.read_text(encoding="utf-8"))
                  planned = str(report.get("planned", "unknown"))
              except (OSError, ValueError, TypeError, AttributeError):
                  planned = "unreadable"
          summary = [
              "## Meta engagement read-only health audit",
              "",
              f"- Mode: `{os.environ.get('ENGAGEMENT_MODE_ACTUAL', 'unknown')}`",
              f"- Verification: **{state}**",
              f"- Instagram historical API-ACK records (not treated as verified likes): **{accepted['instagram'] if accepted['instagram'] is not None else 'unknown'}**",
              f"- Facebook historical API-ACK records (historical acknowledgement only): **{accepted['facebook'] if accepted['facebook'] is not None else 'unknown'}**",
              f"- Planned operations: **{planned}**",
              "",
              "A read-only run does not create engagement. Historical API acknowledgements are retained and are not platform-side verification.",
              "No new like actions are attempted or reported as successful.",
          ]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as output:
              output.write("\n".join(summary) + "\n")
          PY
      - name: Preserve operation support and permission report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cross-engagement-report
          path: |
            cross-engagement/report.json
            cross-engagement/plan.json
          if-no-files-found: warn
          retention-days: 30
