name: Meta cross-account engagement
on:
  schedule:
    # One verified, individually ledgered cross-account like per tick at most.
    # Every 15 minutes; GitHub can delay scheduled starts.
    # Never bulk-like, save or repost. Provider restrictions remain authoritative.
    - cron: '7,22,37,52 * * * *'
  push:
    branches: [main]
    # A single approval marker starts the first bounded real tick on merge.
    # Unrelated pushes never trigger engagement.
    paths: ['docs/meta-cross-engagement-live-2026-11-08.md']
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Source run ID or latest (processes all native posts in the last 24 hours)
        required: false
        default: latest
        type: string
      mode:
        description: Preview or execute supported API operations
        required: true
        default: dry_run
        type: choice
        options: [dry_run, apply]
  pull_request:
    paths:
      - 'meta_cross_engagement.py'
      - 'test_meta_cross_engagement.py'
      - '.github/workflows/meta_cross_engagement.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: meta-cross-engagement-ledger
  cancel-in-progress: false
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: pip install --require-hashes -r requirements.txt
      - name: Verify identities, unsupported actions, dedupe and crash safety with mocks
        run: python -m unittest -v test_meta_cross_engagement.py
  engage:
    needs: tests
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || github.event_name == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN_ID: ${{ inputs.source_run_id || 'latest' }}
      ENGAGEMENT_SCOPE: recent_window
      # Manual runs remain read-only and ToonZone-focused; scheduled and
      # one-time marker runs use the guarded one-like-only plan.
      META_AUDIT_FOCUS: ${{ github.event_name == 'workflow_dispatch' && 'ToonZone' || '' }}

      META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
      ENABLE_TP_NORMAL_ROUTES: ${{ vars.ENABLE_TP_NORMAL_ROUTES }}
      ENABLE_GONLE_NORMAL_ROUTES: ${{ vars.ENABLE_GONLE_NORMAL_ROUTES }}
      ENABLE_GONLE_INSTAGRAM_ROUTES: ${{ vars.ENABLE_GONLE_INSTAGRAM_ROUTES }}
      ENABLE_DAILY_LAUGH_NORMAL_ROUTES: ${{ vars.ENABLE_DAILY_LAUGH_NORMAL_ROUTES }}
      ENABLE_DAILY_LAUGH_INSTAGRAM_ROUTES: ${{ vars.ENABLE_DAILY_LAUGH_INSTAGRAM_ROUTES }}
      ENABLE_FILM_ROUTES: ${{ vars.ENABLE_FILM_ROUTES }}
      FILM_RIGHTS_APPROVED: ${{ vars.FILM_RIGHTS_APPROVED }}
      ENABLE_TOONZONE_ROUTES: ${{ vars.ENABLE_TOONZONE_ROUTES }}
      ENABLE_NEW_META_ROUTES: ${{ vars.ENABLE_NEW_META_ROUTES }}
      META_NEW_ROUTES_RIGHTS_APPROVED: ${{ vars.META_NEW_ROUTES_RIGHTS_APPROVED }}
      META_CROSS_ENGAGEMENT_ENABLED: ${{ vars.META_CROSS_ENGAGEMENT_ENABLED || 'true' }}
      META_CROSS_REPOST_ENABLED: 'false'
      # Live scheduled runs are strictly one-like only (never bulk apply).
      # A marker push on main authorizes an immediate first bounded tick.
      GITHUB_EVENT_NAME: ${{ github.event_name }}
      GITHUB_REF: ${{ github.ref }}
      ENGAGEMENT_MODE: ${{ github.event_name == 'schedule' && 'single_like' || github.event_name == 'push' && 'single_like' || 'dry_run' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: pip install --require-hashes -r requirements.txt
      - name: Read recent publisher results and verified actor identities; prepare independent ledger
        run: python meta_cross_engagement.py plan
      - name: Persist all intents before any engagement POST
        if: env.META_CROSS_ENGAGEMENT_ENABLED == 'true' && (env.ENGAGEMENT_MODE == 'apply' || env.ENGAGEMENT_MODE == 'single_like')
        uses: actions/upload-artifact@v4
        with:
          name: cross-engagement-intent
          path: cross-engagement/engagement.json
          if-no-files-found: error
          retention-days: 90
      - name: Execute supported operations once; preserve ambiguous results
        run: python meta_cross_engagement.py execute
      - name: Preserve independent engagement ledger including partial results
        id: verified_ledger
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cross-engagement-result
          path: cross-engagement/engagement.json
          if-no-files-found: ignore
          retention-days: 90
      - name: Send one separate Telegram receipt only for genuinely accepted likes
        if: >-
          success() &&
          steps.verified_ledger.outcome == 'success' &&
          (env.ENGAGEMENT_MODE == 'apply' || env.ENGAGEMENT_MODE == 'single_like')
        env:
          ENGAGEMENT_RESULT_ARCHIVED: 'true'
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python meta_cross_engagement_receipts.py
      - name: Publish verified like acceptance summary
        if: always()
        env:
          ENGAGEMENT_MODE_ACTUAL: ${{ env.ENGAGEMENT_MODE }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          ledger_path = Path("cross-engagement/engagement.json")
          report_path = Path("cross-engagement/report.json")
          accepted = {"instagram": 0, "facebook": 0}
          state = "NO_LEDGER"
          if ledger_path.is_file():
              try:
                  ledger = json.loads(ledger_path.read_text(encoding="utf-8"))
                  actions = ledger.get("actions", {})
                  if not isinstance(actions, dict):
                      raise ValueError("invalid actions")
                  for record in actions.values():
                      if not isinstance(record, dict):
                          continue
                      platform = record.get("platform")
                      if (platform in accepted and record.get("operation") == "like"
                              and record.get("status") == "accepted"
                              and record.get("api_ack") is True):
                          accepted[platform] += 1
                  state = "GRAPH_ACK_PRESENT" if sum(accepted.values()) else "NO_ACCEPTED_GRAPH_ACK"
              except (OSError, ValueError, TypeError):
                  state = "INVALID_LEDGER"
          planned = "unknown"
          if report_path.is_file():
              try:
                  report = json.loads(report_path.read_text(encoding="utf-8"))
                  planned = str(report.get("planned", "unknown"))
              except (OSError, ValueError, TypeError, AttributeError):
                  planned = "unreadable"
          summary = [
              "## Meta cross-account like verification",
              "",
              f"- Mode: `{os.environ.get('ENGAGEMENT_MODE_ACTUAL', 'unknown')}`",
              f"- Verification: **{state}**",
              f"- Instagram accepted Graph ACK records in retained ledger: **{accepted['instagram']}**",
              f"- Facebook accepted Graph ACK records in retained ledger: **{accepted['facebook']}**",
              f"- Planned operations: **{planned}**",
              "",
              "A green workflow alone is not proof of a like. Only accepted, API-acknowledged ledger entries count.",
              "Counts describe the retained ledger, not necessarily likes created by this run.",
          ]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as output:
              output.write("\n".join(summary) + "\n")
          PY
      - name: Preserve operation support and permission report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cross-engagement-report
          path: |
            cross-engagement/report.json
            cross-engagement/plan.json
          if-no-files-found: warn
          retention-days: 30
