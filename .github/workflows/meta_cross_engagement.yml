name: Meta cross-account engagement
on:
  schedule:
    # Hourly Meta identity/content and permission audit (TRT, every hour).
    # Scheduled runs remain dry_run: never mass-like, save, or repost.
    # GitHub Actions scheduled jobs may start late.
    - cron: '0 * * * *'
  push:
    branches: [main]
    # One owner-requested initial batch; unrelated pushes do not execute it.
    paths: ['docs/meta-cross-engagement-start-2026-10-30.md']
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Source run ID or latest (processes all native posts in the last 24 hours)
        required: false
        default: latest
        type: string
      mode:
        description: Preview or execute supported API operations
        required: true
        default: dry_run
        type: choice
        options: [dry_run, apply]
  pull_request:
    paths:
      - 'meta_cross_engagement.py'
      - 'test_meta_cross_engagement.py'
      - '.github/workflows/meta_cross_engagement.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: meta-cross-engagement-ledger
  cancel-in-progress: false
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: pip install --require-hashes -r requirements.txt
      - name: Verify identities, unsupported actions, dedupe and crash safety with mocks
        run: python -m unittest -v test_meta_cross_engagement.py
  engage:
    needs: tests
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || github.event_name == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN_ID: ${{ inputs.source_run_id || 'latest' }}
      ENGAGEMENT_SCOPE: recent_window
      META_AUTH_JSON: ${{ secrets.META_AUTH_JSON }}
      META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
      ENABLE_TP_NORMAL_ROUTES: ${{ vars.ENABLE_TP_NORMAL_ROUTES }}
      ENABLE_GONLE_NORMAL_ROUTES: ${{ vars.ENABLE_GONLE_NORMAL_ROUTES }}
      ENABLE_GONLE_INSTAGRAM_ROUTES: ${{ vars.ENABLE_GONLE_INSTAGRAM_ROUTES }}
      ENABLE_DAILY_LAUGH_NORMAL_ROUTES: ${{ vars.ENABLE_DAILY_LAUGH_NORMAL_ROUTES }}
      ENABLE_DAILY_LAUGH_INSTAGRAM_ROUTES: ${{ vars.ENABLE_DAILY_LAUGH_INSTAGRAM_ROUTES }}
      ENABLE_FILM_ROUTES: ${{ vars.ENABLE_FILM_ROUTES }}
      FILM_RIGHTS_APPROVED: ${{ vars.FILM_RIGHTS_APPROVED }}
      ENABLE_TOONZONE_ROUTES: ${{ vars.ENABLE_TOONZONE_ROUTES }}
      ENABLE_NEW_META_ROUTES: ${{ vars.ENABLE_NEW_META_ROUTES }}
      META_NEW_ROUTES_RIGHTS_APPROVED: ${{ vars.META_NEW_ROUTES_RIGHTS_APPROVED }}
      META_CROSS_ENGAGEMENT_ENABLED: ${{ vars.META_CROSS_ENGAGEMENT_ENABLED || 'true' }}
      META_CROSS_REPOST_ENABLED: 'false'
      # Schedule and push remain read-only; a previous single-like trial is complete.
      GITHUB_EVENT_NAME: ${{ github.event_name }}
      GITHUB_REF: ${{ github.ref }}
      ENGAGEMENT_MODE: ${{ inputs.mode || 'dry_run' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: pip install --require-hashes -r requirements.txt
      - name: Read recent publisher results and verified actor identities; prepare independent ledger
        run: python meta_cross_engagement.py plan
      - name: Persist all intents before any engagement POST
        if: env.META_CROSS_ENGAGEMENT_ENABLED == 'true' && (env.ENGAGEMENT_MODE == 'apply' || env.ENGAGEMENT_MODE == 'single_like')
        uses: actions/upload-artifact@v4
        with:
          name: cross-engagement-intent
          path: cross-engagement/engagement.json
          if-no-files-found: error
          retention-days: 90
      - name: Execute supported operations once; preserve ambiguous results
        run: python meta_cross_engagement.py execute
      - name: Preserve independent engagement ledger including partial results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cross-engagement-result
          path: cross-engagement/engagement.json
          if-no-files-found: ignore
          retention-days: 90
      - name: Preserve operation support and permission report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cross-engagement-report
          path: |
            cross-engagement/report.json
            cross-engagement/plan.json
          if-no-files-found: warn
          retention-days: 30
