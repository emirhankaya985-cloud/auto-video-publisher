name: Film Drive Kontrolu

permissions:
  contents: read

on:
  workflow_dispatch:

jobs:
  audit:
    if: vars.AUTOMATION_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Kodlari Cek
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Python Kur
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Bagimliliklari Yukle
        run: pip install --require-hashes -r requirements.txt
      - name: Film Drive Klasorunu Kontrol Et
        env:
          DRIVE_TOKEN_JSON: ${{ secrets.DRIVE_TOKEN_JSON }}
          TARGET_FOLDER_ID: ${{ secrets.FILM_DRIVE_FOLDER_ID }}
        run: python check_folder.py
