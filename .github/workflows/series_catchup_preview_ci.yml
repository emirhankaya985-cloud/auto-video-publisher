name: Series catch-up safety preview (no publish)
on:
  pull_request:
    paths:
      - 'series_catchup_preview.py'
      - 'test_series_catchup_preview.py'
      - '.github/workflows/series_catchup_preview_ci.yml'
  push:
    branches: [main]
    paths:
      - 'series_catchup_preview.py'
      - 'test_series_catchup_preview.py'
      - '.github/workflows/series_catchup_preview_ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pure-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m unittest -v test_series_catchup_preview.py
