name: Generate ToonZone TXT archive

on:
  push:
    branches: [main]
    paths:
      - build_toonzone_txt_archive.py
      - public_link_runtime.py
      - ordered_channels.py
      - .github/workflows/toonzone_txt_archive.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: toonzone-txt-generator
  cancel-in-progress: false

jobs:
  create:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install locked runtime and Google Drive public folder reader
        run: |
          python -m pip install --require-hashes -r requirements.txt
          python -m pip install gdown==6.4.2
      - name: Generate exact-name ToonZone TXT for every MP4
        run: python build_toonzone_txt_archive.py
      - name: Save generated TXT files and coverage manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: toonzone-generated-txt
          path: toonzone-generated-txt/
          if-no-files-found: warn
          retention-days: 90
