name: ToonZone Instagram first three episodes with real covers
on:
  push:
    branches: [main]
    paths: ['docs/toonzone-instagram-first-three-2026-11-05.md']
  workflow_dispatch:
  pull_request:
    paths:
      - 'toonzone_instagram_first_three.py'
      - 'test_toonzone_first_three.py'
      - 'cloud_omnichannel_publisher.py'
      - '.github/workflows/toonzone_instagram_first_three.yml'
permissions:
  contents: read
  actions: read
jobs:
  replace_unstarted_worker:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    permissions:
      actions: write
      contents: read
    steps:
      - name: Replace only the worker stalled before reservation or publication
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: emirhankaya985-cloud/auto-video-publisher
        run: |
          set -eu
          prior=42099396893
          gh api "repos/$GH_REPO/actions/runs/$prior/jobs" > /tmp/prior-jobs.json
          jq -e '.jobs[] | select(.name == "publish") | .steps | any(.number == 4 and .status == "in_progress") and all(.[]; .number < 5 or .status == "pending")' /tmp/prior-jobs.json
          gh api --method POST "repos/$GH_REPO/actions/runs/$prior/cancel"
          finished=false
          for attempt in $(seq 1 60); do
            status=$(gh api "repos/$GH_REPO/actions/runs/$prior" --jq '.status')
            if [ "$status" = completed ]; then finished=true; break; fi
            sleep 2
          done
          test "$finished" = true
          gh api "repos/$GH_REPO/actions/runs/$prior/artifacts" --jq '.total_count' > /tmp/prior-artifact-count
          test "$(cat /tmp/prior-artifact-count)" = 0
          echo 'PRIOR_UNSTARTED_WORKER_CANCELLED_NO_INTENT_OR_POST'
  verify:
    needs: replace_unstarted_worker
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - timeout-minutes: 5
        run: |
          pip install --require-hashes -r requirements.txt
          pip install gdown==6.4.2 pillow==13.0.0 PyYAML==6.0.2
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get -o Acquire::http::Timeout=20 -o Acquire::Retries=1 update -qq
            sudo apt-get -o Acquire::http::Timeout=20 -o Acquire::Retries=1 install -y --no-install-recommends ffmpeg
          fi
          ffmpeg -version | head -n 1
      - run: python migration_985_tests.py
  publish:
    needs: verify
    if: github.repository == 'emirhankaya985-cloud/auto-video-publisher' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    concurrency:
      group: toonzone-instagram-owner-publication
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - timeout-minutes: 5
        run: |
          pip install --require-hashes -r requirements.txt
          pip install gdown==6.4.2 pillow==13.0.0
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get -o Acquire::http::Timeout=20 -o Acquire::Retries=1 update -qq
            sudo apt-get -o Acquire::http::Timeout=20 -o Acquire::Retries=1 install -y --no-install-recommends ffmpeg
          fi
          ffmpeg -version | head -n 1
      - name: Verify twelve exact Drive covers and reserve ordered parts
        run: python toonzone_instagram_first_three.py prepare
      - name: Persist reservations before Instagram writes
        id: intent
        uses: actions/upload-artifact@v4
        with:
          name: toonzone-first-three-intent
          path: toonzone-first-three-runtime/alert-history.json
          if-no-files-found: error
          retention-days: 90
      - name: Publish each part and verify the actual Instagram thumbnail before continuing
        env:
          FIRST_THREE_INTENT_ARCHIVED: ${{ steps.intent.outcome == 'success' && 'true' || 'false' }}
        run: python toonzone_instagram_first_three.py publish
      - name: Preserve post IDs and uncertain attempts
        if: always() && steps.intent.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: toonzone-first-three-result
          path: toonzone-first-three-runtime/alert-history.json
          if-no-files-found: error
          retention-days: 90
      - name: Preserve prepared and actual Instagram cover previews
        if: always() && steps.intent.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: toonzone-first-three-cover-evidence
          path: |
            toonzone-first-three-runtime/previews/
            toonzone-first-three-runtime/plan.json
          if-no-files-found: warn
          retention-days: 14
