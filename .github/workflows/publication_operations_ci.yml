name: Publication operations no-publish CI
on:
  pull_request:
    paths:
      - 'publication_operations.py'
      - 'test_publication_operations.py'
      - 'content_stock.py'
      - 'media_quality.py'
      - 'performance_history.py'
      - 'test_content_features.py'
      - 'operational_enhancements.py'
      - 'test_operational_enhancements.py'
      - '.github/workflows/publication_operations_ci.yml'
      - '.github/workflows/public_link_schedule.yml'
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m unittest -v test_publication_operations.py test_content_features.py test_operational_enhancements.py
