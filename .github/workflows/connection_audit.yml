name: Read-only YouTube connections and batch history

on:
  workflow_dispatch:
    inputs:
      audit_scope:
        description: Read-only audit scope
        type: choice
        default: all
        options:
          - all
          - new-youtube
          - candidates
          - batch-history

permissions:
  contents: read

concurrency:
  group: read-only-connection-audit
  cancel-in-progress: false

jobs:
  audit:
    if: vars.AUTOMATION_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: pip install --require-hashes -r requirements.txt
      - name: Verify new YouTube credentials and exact Drive candidates without publishing
        if: ${{ inputs.audit_scope == 'new-youtube' || inputs.audit_scope == 'all' }}
        env:
          TOKEN_DAILY_LAUGH_LAB_JSON: ${{ secrets.TOKEN_DAILY_LAUGH_LAB_JSON }}
          TOKEN_GONLE_DUSEN_JSON: ${{ secrets.TOKEN_GONLE_DUSEN_JSON }}
          DRIVE_TOKEN_JSON: ${{ secrets.DRIVE_TOKEN_JSON }}
          DAILY_LAUGH_DRIVE_FOLDER_ID: ${{ secrets.DAILY_LAUGH_DRIVE_FOLDER_ID }}
          GONLE_DUSEN_DRIVE_FOLDER_ID: ${{ secrets.GONLE_DUSEN_DRIVE_FOLDER_ID }}
          ENABLE_NEW_YOUTUBE_ROUTES: ${{ vars.ENABLE_NEW_YOUTUBE_ROUTES }}
        run: python connection_audit.py new-youtube
      - name: List safe Drive candidates without publishing
        if: ${{ inputs.audit_scope == 'candidates' }}
        env:
          DRIVE_TOKEN_JSON: ${{ secrets.DRIVE_TOKEN_JSON }}
          DAILY_LAUGH_DRIVE_FOLDER_ID: ${{ secrets.DAILY_LAUGH_DRIVE_FOLDER_ID }}
          GONLE_DUSEN_DRIVE_FOLDER_ID: ${{ secrets.GONLE_DUSEN_DRIVE_FOLDER_ID }}
        run: python connection_audit.py candidates
      - name: Reconcile previous eight targets with production platform records
        if: ${{ !cancelled() && inputs.audit_scope != 'new-youtube' }}
        env:
          TOKEN_CHANNEL1_JSON: ${{ secrets.TOKEN_CHANNEL1_JSON }}
          TOKEN_CHANNEL2_JSON: ${{ secrets.TOKEN_CHANNEL2_JSON }}
          DRIVE_TOKEN_JSON: ${{ secrets.DRIVE_TOKEN_JSON }}
          META_AUTH_JSON: ${{ secrets.META_AUTH_JSON }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
        run: python connection_audit.py batch-history
