services:
  - type: web
    name: social-analytics-dashboard
    runtime: python
    plan: free
    region: frankfurt
    branch: feature/secure-dashboard-v2
    buildCommand: "python --version"
    startCommand: "python dashboard_server.py"
    healthCheckPath: /healthz
    envVars:
      - key: DASHBOARD_PASSWORD
        sync: false
      - key: ANALYTICS_ARCHIVE_PATH
        value: dashboard-data/daily_video_views.jsonl
